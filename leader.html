<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leader Console · The 144(P) Plan</title>
<meta name="theme-color" content="#123C56">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<script src="./cloud.js"></script>
<script src="./book-import.js"></script>
<script src="./print-import.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F3F5F6;color:#173344;font-family:'Public Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
a{color:#075D61}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #0E8A7E;outline-offset:2px}
header{background:#123C56;color:#fff;padding:14px 20px}
header .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-family:'Source Serif 4',Georgia,serif;font-size:21px;font-weight:600;flex:1}
header .who{font-size:14px;opacity:.9}
header button{background:none;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
nav{background:#fff;border-bottom:1px solid #E1E7EA}
nav .in{max-width:1080px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 12px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 12px;font-weight:600;color:#4F5F68;cursor:pointer;white-space:nowrap}
nav button[aria-current=page]{color:#123C56;border-bottom-color:#075D61}
main{max-width:1080px;margin:0 auto;padding:20px 20px 60px}
nav .grp{display:none}
/* Admin Panel: tabs down the left side on wider screens */
@media (min-width:800px){
  body.side .shell{display:flex;align-items:flex-start}
  body.side nav{position:sticky;top:0;flex:0 0 220px;height:100vh;overflow-y:auto;border-bottom:0;border-right:1px solid #E1E7EA}
  body.side nav .in{flex-direction:column;gap:2px;padding:14px 10px 40px;max-width:none;overflow:visible}
  body.side nav button{text-align:left;border-bottom:0;border-left:3px solid transparent;border-radius:0 8px 8px 0;padding:10px 12px;width:100%}
  body.side nav button:hover{background:#F1F5F7;color:#123C56}
  body.side nav button[aria-current=page]{background:#E6F2F2;border-left-color:#075D61;color:#123C56}
  body.side nav .grp{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6A7A84;padding:14px 12px 6px}
  body.side nav .grp:first-child{padding-top:4px}
  body.side main{flex:1;min-width:0;max-width:1100px;margin:0}
  body.side header .in{max-width:none}
}
h2{font-family:'Source Serif 4',Georgia,serif;font-weight:600;color:#123C56;font-size:24px;margin:6px 0 4px}
p.sub{margin:4px 0 14px;color:#4F5F68;line-height:1.5}
.card{background:#fff;border:1px solid #E1E7EA;border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
label{font-size:13px;font-weight:600;color:#4F5F68;display:block;margin-bottom:4px}
input[type=text],input[type=search],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{min-height:42px;border:1px solid #9AA8B0;border-radius:8px;padding:8px 10px;background:#fff;color:#173344;font-size:15px}
textarea{width:100%;min-height:320px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.5}
.btn{min-height:42px;border:0;border-radius:8px;background:#123C56;color:#fff;font-weight:600;padding:0 16px;cursor:pointer}
.btn.teal{background:#075D61}
.btn.alt{background:#fff;color:#123C56;border:1px solid #123C56}
.btn.danger{background:#fff;color:#A33A2E;border:1px solid #A33A2E}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px}
.btn[disabled]{background:#C9D2D7;color:#fff;border-color:#C9D2D7;cursor:default}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#4F5F68;font-weight:700;padding:8px;border-bottom:2px solid #E1E7EA}
td{padding:10px 8px;border-bottom:1px solid #EEF1F2;vertical-align:middle}
td input[type=text],td input[type=number],td select{min-height:36px;width:100%}
.tbl{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.ok{background:#E8F5F3;color:#075D61}.pill.wait{background:#FFF4DC;color:#6B4E12}.pill.off{background:#EEF1F2;color:#4F5F68}
.seatbar{height:10px;border-radius:5px;background:#E1E7EA;overflow:hidden;margin-top:8px}
.seatbar span{display:block;height:100%;background:#075D61}
.err{background:#FBEAE7;color:#7A2A20;border-radius:8px;padding:10px 12px;margin-bottom:14px}
.ok{background:#E8F5F3;color:#075D61;border-radius:8px;padding:10px 12px;margin-bottom:14px}
.empty{color:#4F5F68;padding:14px 4px}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:18px;letter-spacing:.08em;background:#F3F5F6;border-radius:8px;padding:4px 10px}
.check{width:20px;height:20px;accent-color:#075D61}
.sticky{position:sticky;bottom:0;background:#fff;border-top:1px solid #E1E7EA;padding:12px 0 0;margin-top:8px}
.signin{max-width:420px;margin:40px auto}
.signin input{width:100%}
.muted{color:#4F5F68;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.church .qr{flex:none;width:150px;height:150px;border:1px solid #E1E7EA;border-radius:8px;padding:4px;background:#fff}
.church .qr svg{width:100%;height:100%;display:block}
.church .link{font-size:13px;color:#4F5F68;word-break:break-all;background:#F3F5F6;border-radius:8px;padding:6px 10px}
.church .admins{border-top:1px solid #E1E7EA;margin-top:14px;padding-top:12px}
.church .admins ul{list-style:none;padding:0;margin:8px 0}
.church .admins li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;flex-wrap:wrap}
tr.gone td{color:#7A8890}
td.acts{white-space:nowrap}
header .hlink{color:#fff;font-weight:600;text-decoration:none;margin-right:14px;font-size:14px}
.grp .mlist{list-style:none;padding:0;margin:10px 0 0}
.mlist{list-style:none;padding:0;margin:6px 0 0}
.mlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #EEF1F2;flex-wrap:wrap}
.addbox{border:1px solid #CFE3E0;background:#F7FBFA;border-radius:10px;padding:12px;margin-top:12px}
.pick{display:flex;gap:10px;align-items:center;margin:0;padding:8px 2px;font-weight:500;color:#173344;border-bottom:1px solid #EEF1F2;cursor:pointer}
.pick.all{font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.tile{background:#fff;border:1px solid #E1E7EA;border-radius:14px;padding:14px}
.tile.warn{border-color:#D9A62B;background:#FFF8E6}
.tile .tl{font-size:13px;color:#4F5F68;font-weight:600}
.tile .tv{font-size:28px;font-weight:700;color:#123C56;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.tile .ts{font-size:12.5px;color:#4F5F68;line-height:1.45}
h3.dh{margin:22px 0 10px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#4F5F68}
.meter{display:block;height:6px;border-radius:3px;background:#E8EEF1;margin:4px 0 6px;overflow:hidden}
.meter span{display:block;height:100%;background:#123C56;border-radius:3px}
.chart .cw{position:relative;margin-top:8px}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{font-size:11px;fill:#6A7A84}
.chart .pk{font-size:11px;fill:#173344;font-weight:700}
.chart .bar.on path{fill:#2A62A6}
.chart .tip{position:absolute;background:#173344;color:#fff;font-size:12.5px;padding:6px 8px;border-radius:6px;pointer-events:none;white-space:nowrap}
table.mini{font-size:13px;margin-top:6px}
table.mini td{padding:3px 12px 3px 0}
</style>
</head>
<body>
<header><div class="in"><h1 id="ttl">The 144(P) Plan · Leader Console</h1><a class="hlink" href="challenges.html">Challenges</a><span class="who" id="who"></span><button id="out" type="button" hidden>Sign out</button></div></header>
<div class="shell">
<nav id="nav" hidden aria-label="Sections"><div class="in" id="tabs"></div></nav>
<main id="app" aria-live="polite"><p class="sub">Loading…</p></main>
</div>
<script>
(function () {
  const $ = id => document.getElementById(id), $app = $('app');
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const money = n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fDate = d => d ? new Date(String(d).slice(0, 10) + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
  const errMsg = e => (e && (e.message || e.error_description)) || 'Something went wrong. Please try again.';
  const STATUS = { pending_payment: ['Waiting for payment', 'wait'], active: ['Active', 'ok'], canceled: ['Canceled', 'off'] };
  const pill = s => { const [t, c] = STATUS[s] || [s || 'None', 'off']; return `<span class="pill ${c}">${esc(t)}</span>`; };
  const st = { tab: 'approvals', admin: false, churches: [], church: null, members: [], seat: null, sel: new Set(), msg: '', err: '', plans: [], season: null, licenses: [], allChurches: [], churchAdmins: [], challengesAll: [], dash: null, keys: [], claims: [], printStat: null, printPrev: null, printBusy: '', msgs: [], msgDraft: '', msgTo: '', payments: [], buy: false, buyOpts: null, buySeats: "", groups: [], roster: [], gAdd: null, gSel: new Set(), gRename: null, seats: [], sections: [], editSlug: null, importSecs: null };
  let c = null;

  const flash = (m, isErr) => { if (isErr) { st.err = m; st.msg = ''; } else { st.msg = m; st.err = ''; } };
  const notes = () => (st.err ? `<div class="err" role="alert">${esc(st.err)}</div>` : '') + (st.msg ? `<div class="ok" role="status">${esc(st.msg)}</div>` : '');
  async function run(fn, okMsg) { try { await fn(); if (okMsg) flash(okMsg); } catch (e) { flash(errMsg(e), true); } render(); }

  // ---------- tabs ----------
  const TABS = () => [['approvals', 'Approvals'], ['groups', 'Groups'], ['messages', 'Messages'],
    ...(st.admin ? [['dash', 'Dashboard'], ['members', 'All members'], ['nochurch', 'No church'], ['prices', 'Prices'], ['licenses', 'Licenses'], ['churches', 'Churches'], ['season', 'Season'], ['book', 'Book'], ['keys', 'Book keys'], ['challenges', 'Challenges'], ['payments', 'Payments'], ['settings', 'Settings'], ...(st.owner ? [['roles', 'Roles']] : [])]
      : st.am ? [['amdash', 'My churches'], ['churches', 'Churches'], ['licenses', 'Licenses']] : [])];
  function renderNav() {
    $('nav').hidden = false;
    document.body.classList.toggle('side', !!(st.admin || st.am));
    const btn = ([k, t]) => `<button type="button" data-tab="${k}" ${st.tab === k ? 'aria-current="page"' : ''}>${t}</button>`;
    const T = TABS();
    if (st.admin || st.am) {
      // Admin Panel: admin sections first, then the church tools
      const mine = ['approvals', 'groups', 'messages'];
      $('tabs').innerHTML = `<div class="grp">${st.admin ? 'Admin' : 'Account manager'}</div>${T.filter(x => !mine.includes(x[0])).map(btn).join('')}<div class="grp">Church tools</div>${T.filter(x => mine.includes(x[0])).map(btn).join('')}`;
    } else $('tabs').innerHTML = T.map(btn).join('');
    $('tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = async () => { st.tab = b.dataset.tab; st.msg = st.err = ''; await loadTab(); });
  }
  function render() { renderNav(); $app.innerHTML = notes() + (VIEWS[st.tab] || VIEWS.approvals)(); (BIND[st.tab] || (() => {}))(); }

  // ---------- approvals ----------
  async function loadChurch() {
    if (!st.church) return;
    const [mem, seat] = await Promise.all([Cloud.rpc('leader_members', { cid: st.church.church_id }), Cloud.rpc('church_seat_status', { cid: st.church.church_id })]);
    st.members = mem || []; st.seat = (seat && seat[0]) || null; st.sel = new Set();
    st.invoices = [];
    if (canName()) {
      try { st.invoices = (await Cloud.rpc('church_invoices', { cid: st.church.church_id })) || []; } catch (e) { st.invoices = []; }
      // An invoice may have been paid since we last looked: ask Stripe, then reload once
      if (st.invoices.some(i => i.status === 'open') && !st.invoiceSynced) {
        st.invoiceSynced = true;
        try { const r = await Cloud.pay({ action: 'sync_invoices' }); if (Object.values((r && r.checked) || {}).includes('paid')) return loadChurch(); } catch (e) {}
      }
    }
  }
  const canName = () => st.church && ['church_admin', 'platform_admin', 'account_manager'].includes(st.church.role);
  const VIEWS = {}, BIND = {};
  VIEWS.approvals = () => {
    if (!st.churches.length) return `<h2>Approvals</h2><p class="sub">You aren’t a leader for any church yet. Your church admin can make you a group leader.</p>`;
    const pend = st.members.filter(m => m.status === 'pending'), ver = st.members.filter(m => m.status === 'verified');
    const s = st.seat || {}, cap = s.seats || 0, used = s.used || ver.length, left = cap ? cap - used : null;
    const all = pend.length > 0 && pend.every(m => st.sel.has(m.membership_id));
    const ns = st.notify;
    const emailCard = ns ? `<div class="card"><label class="pick" style="border:0;padding:0"><input type="checkbox" class="check" id="nsNew" ${ns.email_new_members ? 'checked' : ''}> <span><strong>Email me about new members</strong><br><span class="muted">${st.admin ? 'New accounts, join requests at every church, payments and new churches' : 'Each time someone asks to join your church'}, sent to ${esc(ns.email || 'your account email')}.</span></span></label></div>` : '';
    const nameCard = st.nameOk === false ? `<div class="card" style="border-color:#D9A62B;background:#FFF8E6"><strong>Add your full name.</strong> Members see your name on messages and approvals. Open <a href="./">the app</a> › More › My Account, enter your first and last name, and tap Save changes.</div>` : '';
    return `<h2>Approvals</h2><p class="sub">Approve people who belong to your church. Approved members can read the book and count toward your church’s score.</p>${nameCard}${emailCard}
      <div class="card"><div class="row">
        ${st.churches.length > 1 ? `<div><label for="ch">Church</label><select id="ch">${st.churches.map(x => `<option value="${x.church_id}" ${x.church_id === st.church.church_id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>` : `<div><label>Church</label><strong>${esc(st.church.name)}</strong></div>`}
        <div class="grow"></div>
        <div><label>Church code to share</label><span class="code">${esc(st.church.code)}</span></div>
      </div>
      <div style="margin-top:14px">${cap ? `<strong>${used} of ${cap}</strong> seats used · ${esc(s.plan_name || '')} license ${pill(s.license_status)}${s.expires_at ? ` <span class="muted">· good through ${fDate(s.expires_at)}</span>` : ''}<div class="seatbar" aria-hidden="true"><span style="width:${Math.min(100, Math.round(used / cap * 100))}%"></span></div>` : `<span class="muted">No book license for ${esc(s.season_name || 'this season')} yet. You can still approve members; the book opens once a license is active.</span>`}</div>
      ${invoiceList()}
      ${canName() ? (st.buy ? buyBox() : `<button class="btn teal" type="button" id="buyOpen" style="margin-top:12px">${s.license_status === 'active' ? 'Add seats' : 'Buy seats for your church'}</button>`) : ''}</div>

      <div class="card"><div class="row"><h3 style="margin:0;font-size:18px" class="grow">Waiting for approval (${pend.length})</h3></div>
      ${pend.length ? `<div class="tbl"><table><thead><tr>
          <th style="width:44px"><input type="checkbox" class="check" id="all" ${all ? 'checked' : ''} aria-label="Select all ${pend.length} people waiting"></th>
          <th>Name</th><th>Email</th><th>Asked</th><th style="width:190px"><span class="sr">Actions</span></th></tr></thead><tbody>
        ${pend.map(m => `<tr><td><input type="checkbox" class="check" data-sel="${m.membership_id}" ${st.sel.has(m.membership_id) ? 'checked' : ''} aria-label="Select ${esc(m.name)}"></td>
          <td><strong>${esc(m.name)}</strong>${m.same_name ? `<br><span class="pill wait" title="Another member of this church has the same name. Check the email to be sure it's a different person.">Same name as ${m.same_name} other${m.same_name === 1 ? '' : 's'} · check email</span>` : ''}</td><td>${esc(m.email)}</td><td>${fDate(m.joined_at)}</td>
          <td><div class="row"><button class="btn teal sm" type="button" data-ap="${m.membership_id}">Approve</button><button class="btn danger sm" type="button" data-dc="${m.membership_id}">Decline</button></div></td></tr>`).join('')}
        </tbody></table></div>
        <div class="sticky row"><span class="muted grow">${st.sel.size} selected${left != null ? ` · ${left} seats left` : ''}</span>
          <button class="btn danger" type="button" id="dcSel" ${st.sel.size ? '' : 'disabled'}>Decline selected</button>
          <button class="btn teal" type="button" id="apSel" ${st.sel.size ? '' : 'disabled'}>Approve selected (${st.sel.size})</button></div>`
        : `<p class="empty">No one is waiting. New requests appear here when people enter your church code in the app.</p>`}</div>

      <div class="card"><h3 style="margin:0 0 8px;font-size:18px">Approved members (${ver.length})</h3>
      ${ver.length ? `<div class="tbl"><table><thead><tr><th>Name</th><th>Email</th><th>Can approve new members</th></tr></thead><tbody>
        ${ver.map(m => `<tr><td>${esc(m.name)}${m.same_name ? `<br><span class="pill wait" title="Another member of this church has the same name. Check the email to be sure it's a different person.">Same name as ${m.same_name} other${m.same_name === 1 ? '' : 's'} · check email</span>` : ''}</td><td>${esc(m.email)}</td><td>${canName() ? `<label style="display:flex;gap:8px;align-items:center;margin:0;color:#173344;font-weight:500"><input type="checkbox" class="check" data-ld="${m.membership_id}" ${m.is_leader ? 'checked' : ''}> Can approve members</label>` : (m.is_leader ? 'Yes' : '—')}</td></tr>`).join('')}
        </tbody></table></div>` : `<p class="empty">No approved members yet.</p>`}</div>`;
  };
  function buyBox() {
    const o = st.buyOpts;
    if (!o) return `<div class="addbox"><p class="muted">Loading prices…</p></div>`;
    const cur = o.current && o.current.status === 'active' ? o.current : null;
    const T = o.tiers || [], nf = n => Number(n).toLocaleString('en-US');
    const min = cur ? 1 : (o.min_seats || 5), have = cur ? cur.seats : 0, room = (o.max_seats || 0) - have;
    const n = parseInt(st.buySeats, 10), total = have + (n || 0);
    const tier = n > 0 ? T.find(t => total >= t.min && total <= t.max) : null;
    let note = '';
    if (st.buySeats !== '' && st.buySeats != null) {
      if (!(n >= min)) note = cur ? 'Enter at least 1 seat.' : `The smallest purchase is ${min} seats.`;
      else if (n > room) note = `For more than ${nf(o.max_seats)} seats in total, contact us${st.support ? ' at ' + st.support : ''} and we’ll set it up.`;
      else if (!tier) note = 'Seats aren’t available for that number right now.';
    }
    const ok = tier && !note, big = ok && o.invoice_min && n * tier.rate >= Number(o.invoice_min);
    return `<div class="addbox"><div class="row"><strong class="grow">${cur ? `Add seats · you have ${nf(cur.seats)}` : 'Buy seats for your church'}</strong><button class="btn alt sm" type="button" id="buyClose">Close</button></div>
      <p class="muted" style="margin:6px 0 10px">${cur ? `Added seats cost the rate for your new total and end on ${cur.expires_at ? fDate(cur.expires_at) : 'the same date as your others'}.` : 'One payment, good for one year from today. Members you approve read free.'} Prices include tax. All sales are final.</p>
      <div class="tbl"><table><thead><tr><th>Seats in total</th><th>Price per seat</th></tr></thead><tbody>${T.map((t, i) => `<tr${tier && tier.id === t.id ? ' style="background:#E6F2F2;font-weight:700"' : ''}><td>${esc(t.name)} · ${i === T.length - 1 ? nf(t.min) + '+' : nf(t.min) + '–' + nf(t.max)}</td><td>${money(t.rate)}</td></tr>`).join('')}</tbody></table></div>
      <label for="buyN" style="margin-top:12px;display:block;font-weight:600">${cur ? 'How many more seats?' : 'How many seats?'}</label>
      <input id="buyN" type="number" inputmode="numeric" min="${min}" step="1" value="${esc(st.buySeats || '')}" placeholder="${cur ? 'e.g. 10' : 'At least ' + min}" style="max-width:200px">
      ${note ? `<p class="err" style="margin-top:8px">${esc(note)}</p>` : ''}
      ${ok ? `<p style="margin:10px 0 0;font-size:17px"><strong>${nf(n)} seat${n === 1 ? '' : 's'} × ${money(tier.rate)} = ${money(n * tier.rate)}</strong>${cur ? ` <span class="muted">· ${nf(total)} seats in total</span>` : ''}</p>` : ''}
      ${big && o.open_invoice ? `<p class="muted" style="margin-top:10px">Invoice ${esc(o.open_invoice.number || '')} for ${money(o.open_invoice.amount)} is already waiting for payment. You can pay this one by card, or wait until that invoice is paid to ask for another.</p>` : ''}
      ${big && !o.open_invoice ? `<div class="two" style="margin-top:10px;gap:10px;display:grid;grid-template-columns:1fr 1fr">
          <button class="btn teal" type="button" id="buyInv" ${st.invBusy ? 'disabled' : ''}>${st.invBusy ? 'Creating your invoice…' : 'Send me an invoice'}</button>
          <button class="btn alt" type="button" id="buyGo" style="margin-top:0">Pay by card now</button></div>

  BIND.approvals = () => {

  // ---------- prices ----------
  VIEWS.prices = () => `<h2>Prices</h2><p class="sub">The individual price is for one person for a year. Church rows are price levels: a church whose total seats fall between the From and To numbers pays that price for <strong>each seat</strong>. The lowest From number is the smallest purchase. A price change applies to new purchases; seats already bought keep their price.</p>

    <p class="muted">Keep the church levels from overlapping, with no gaps between them. Example: 5–999, 1,000–4,999, 5,000–19,999.</p>`;
  BIND.prices = () => {

  const hmin = v => { v = Math.round(v || 0); return v >= 60 ? Math.floor(v / 60).toLocaleString('en-US') + 'h ' + (v % 60) + 'm' : v + 'm'; };
  const tile = (label, value, sub, warn) => `<div class="tile${warn ? ' warn' : ''}"><div class="tl">${esc(label)}</div><div class="tv">${esc(value)}</div>${sub ? `<div class="ts">${sub}</div>` : ''}</div>`;
  // single-series bar chart: one hue, rounded data ends anchored to the baseline, hover tooltip, table view
  function bars(id, title, rows, fmtVal, fmtLab) {
    const W = 640, H = 170, padL = 8, padB = 22, padT = 18, n = rows.length, gap = 2;
    const max = Math.max(1, ...rows.map(r => r.v)), bw = (W - padL * 2) / n - gap;
    const y = v => padT + (H - padT - padB) * (1 - v / max);
    const path = (x, top, w, base) => { const h = base - top; if (h <= 0) return ''; const r = Math.min(4, w / 2, h); return `M${x},${base}V${top + r}Q${x},${top} ${x + r},${top}H${x + w - r}Q${x + w},${top} ${x + w},${top + r}V${base}Z`; };
    const base = H - padB, last = rows.length - 1;
    const marks = rows.map((r, i) => { const x = padL + i * (bw + gap); return `<g class="bar" data-tip="${esc(fmtLab(r.k, true))}: ${esc(fmtVal(r.v))}"><rect x="${x - gap / 2}" y="0" width="${bw + gap}" height="${H}" fill="transparent"></rect><path d="${path(x, y(r.v), bw, base)}" fill="#123C56"></path>
      ${i % Math.ceil(n / 6) === 0 || i === last ? `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" class="ax">${esc(fmtLab(r.k))}</text>` : ''}</g>`; }).join('');
    const peak = rows.reduce((a, r, i) => r.v > rows[a].v ? i : a, 0);
    const peakLbl = rows[peak].v > 0 ? `<text x="${padL + peak * (bw + gap) + bw / 2}" y="${y(rows[peak].v) - 5}" text-anchor="middle" class="pk">${esc(fmtVal(rows[peak].v))}</text>` : '';
    return `<div class="card chart"><div class="row"><strong class="grow">${esc(title)}</strong></div>
      <div class="cw" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}"><line x1="${padL}" x2="${W - padL}" y1="${base}" y2="${base}" stroke="#D5DDE1" stroke-width="1"></line>${marks}${peakLbl}</svg><div class="tip" hidden></div></div>
      <details><summary class="muted">Show as table</summary><table class="mini">${rows.map(r => `<tr><td>${esc(fmtLab(r.k, true))}</td><td>${esc(fmtVal(r.v))}</td></tr>`).join('')}</table></details></div>`;
  }
  const dShort = d => new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  VIEWS.dash = () => { const D = st.dash; if (!D) return '<h2>Dashboard</h2><p class="sub">Loading…</p>';
    const M = D.members, E = D.engagement, C = D.churches, R = D.revenue, CH = D.challenges, S = D.season || {};
    const todo = [C.requests ? `<button class="btn alt sm" type="button" data-go="churches">${C.requests} church/group request${C.requests === 1 ? '' : 's'} to approve</button>` : '',
      M.pending ? `<button class="btn alt sm" type="button" data-go="nochurch">${M.pending} member${M.pending === 1 ? '' : 's'} waiting for church approval</button>` : '',
      D.invoices && D.invoices.open ? `<button class="btn alt sm" type="button" data-go="payments">${D.invoices.open} invoice${D.invoices.open === 1 ? '' : 's'} waiting for payment (${usd(D.invoices.open_amount)})${D.invoices.overdue ? ` · ${D.invoices.overdue} past due` : ''}</button>` : '',
      C.leader_requests ? `<span class="pill wait">${C.leader_requests} group-leader request${C.leader_requests === 1 ? '' : 's'} (church admins approve)</span>` : ''].filter(Boolean).join(' ');
    const seatPct = C.seats_sold ? Math.round(C.seats_used / C.seats_sold * 100) : 0;
    return `<h2>Dashboard</h2><p class="sub">Operating overview · updated ${new Date(D.as_of).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })} <button class="btn alt sm" type="button" id="dRef">Refresh</button></p>
      <div class="card" style="background:#0B2257;color:#fff;border-color:#0B2257"><strong style="color:#F2C94C">${esc(S.name || 'Season')}</strong><div style="margin-top:4px;font-size:17px">${S.week ? `Week ${S.week} of 12 is underway.` : S.days_to_start != null ? `Starts in <strong>${n0(S.days_to_start)} days</strong> (${esc(dShort(S.start))}).` : ''}</div></div>
      ${todo ? `<div class="card" style="border-color:#D9A62B;background:#FFF8E6"><strong>Needs your attention</strong><div class="row" style="margin-top:8px">${todo}</div></div>` : ''}
      <h3 class="dh">Members</h3><div class="tiles">
        ${tile('Accounts', n0(M.accounts), `+${n0(M.new_7)} this week · +${n0(M.new_30)} in 30 days`)}
        ${D.categories ? tile('Members · Guests · Trials · Prospects', `${n0(D.categories.member)} · ${n0(D.categories.guest)} · ${n0(D.categories.trial || 0)} · ${n0(D.categories.prospect)}`, '<a href="#" data-go="members">See everyone →</a>') : ''}
        ${tile('In a church', n0(M.in_church), `${n0(M.pending)} waiting for approval`, M.pending > 0)}
        ${tile('Have the study book', n0(M.with_book), `${n0(M.own_seats)} bought their own · ${n0(M.key_claims)} with a book key`)}
        ${tile('No church yet', n0(M.no_church), M.no_church ? '<a href="#" data-go="nochurch">See who →</a>' : 'Candidates for a church code or own seat')}
        ${D.guests ? tile('Guest seats used', `${n0(D.guests.used)} of ${n0(D.guests.given)}`, `${n0(D.guests.active)} reading now · ${n0(D.guests.kept_going)} kept going`) : ''}</div>
      ${bars('cSign', 'New accounts per week (last 12 weeks)', M.signups_by_week.map(r => ({ k: r.week, v: r.n })), n0, (k, full) => full ? 'Week of ' + dShort(k) : dShort(k))}
      <h3 class="dh">Engagement</h3><div class="tiles">
        ${tile('Active last 7 days', n0(E.active_7), 'Logged any time with God')}
        ${tile('Time given, 7 days', hmin(E.minutes_7), `${hmin(E.minutes_all)} all time`)}
        ${tile('Days at 144, 7 days', n0(E.days_at_144_7), 'Member-days that reached 2h 24m')}
        ${tile('Reminders on', n0(E.reminders_push + E.reminders_email), `${n0(E.reminders_push)} notifications · ${n0(E.reminders_email)} email · ${n0(E.devices)} devices`)}</div>
      ${bars('cMin', 'Minutes given per day (last 14 days)', E.minutes_by_day.map(r => ({ k: r.day, v: r.m })), v => hmin(v), (k, full) => full ? new Date(k).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }) : dShort(k))}
      <h3 class="dh">Churches and groups</h3><div class="tiles">
        ${tile('Churches', n0(C.active), `${n0(C.groups_independent)} independent groups · ${n0(C.groups_inside)} groups inside churches`)}
        ${tile('Requests waiting', n0(C.requests), 'New churches and independent groups', C.requests > 0)}
        ${tile('Churches with seats', n0(C.licensed), 'Active study book license')}
        ${tile('Seats used', `${n0(C.seats_used)} of ${n0(C.seats_sold)}`, `<span class="meter"><span style="width:${seatPct}%"></span></span>${seatPct}% of church seats filled`)}</div>
      ${C.top.length ? `<div class="card tbl"><strong>Churches</strong><table><thead><tr><th>Church</th><th>Members</th><th>Waiting</th><th>Seats</th><th>Time given, 7 days</th></tr></thead><tbody>${C.top.map(t => `<tr><td>${esc(t.name)}</td><td>${n0(t.members)}</td><td>${n0(t.pending)}</td><td>${t.seats ? n0(t.seats) : '<span class="muted">none</span>'}</td><td>${hmin(t.minutes_7)}</td></tr>`).join('')}</tbody></table></div>` : ''}
      <h3 class="dh">Time4God Challenge</h3><div class="tiles">
        ${tile('Live now', n0(CH.live))}${tile('Starting later', n0(CH.upcoming))}${tile('Waiting for an answer', n0(CH.waiting))}${tile('Finished', n0(CH.finished))}</div>
      <h3 class="dh">Revenue</h3><p class="sub" style="margin-top:-6px">Real (live) Stripe payments only, before Stripe fees. Prices include tax. Licenses you enter by hand in the Licenses tab aren’t counted.</p><div class="tiles">
        ${tile('Total revenue', usd(R.total), `${n0(R.payments)} payment${R.payments === 1 ? '' : 's'}`)}
        ${tile('This month', usd(R.month), `${usd(R.last_30)} in the last 30 days`)}
        ${tile('Where it came from', usd(R.individual + R.church + R.upgrades), `Individuals ${usd(R.individual)} · Church seats ${usd(R.church)} · Added seats ${usd(R.upgrades)}`)}
        ${tile('Renewals in 60 days', n0(R.renewals_60), `${n0(R.abandoned_30)} unfinished checkout${R.abandoned_30 === 1 ? '' : 's'} in 30 days`)}</div>
      ${bars('cRev', 'Revenue per month (last 12 months)', R.by_month.map(r => ({ k: r.month, v: Number(r.amount) })), usd, (k, full) => new Date(k).toLocaleDateString('en-US', full ? { month: 'long', year: 'numeric', timeZone: 'UTC' } : { month: 'short', timeZone: 'UTC' }))}
      ${R.test_payments ? `<p class="muted" style="font-size:13px">Stripe test mode: ${n0(R.test_payments)} practice payment${R.test_payments === 1 ? '' : 's'} (${usd(R.test_total)}) are left out of these totals.</p>` : ''}
      ${R.recent.length ? `<div class="card tbl"><strong>Latest payments</strong><table><tbody>${R.recent.map(p => `<tr><td class="muted">${fDate(p.paid_at)}</td><td>${esc(p.description)}${p.test ? ' <span class="pill off">Test</span>' : ''}</td><td><strong>${usd(p.amount)}</strong></td></tr>`).join('')}</tbody></table><button class="btn alt sm" type="button" data-go="payments" style="margin-top:8px">All payments</button></div>` : ''}`; };
  BIND.dash = () => {
    if ($('dRef')) $('dRef').onclick = () => run(async () => { await loadTab(true); });
    $app.querySelectorAll('[data-go]').forEach(b => b.onclick = async () => { st.tab = b.dataset.go; st.msg = st.err = ''; await loadTab(); });
    $app.querySelectorAll('.cw').forEach(w => { const tip = w.querySelector('.tip');
      w.querySelectorAll('.bar').forEach(g => { g.onmousemove = e => { const r = w.getBoundingClientRect(); tip.hidden = false; tip.textContent = g.dataset.tip; tip.style.left = Math.min(r.width - 150, Math.max(0, e.clientX - r.left - 60)) + 'px'; tip.style.top = Math.max(0, e.clientY - r.top - 40) + 'px'; g.classList.add('on'); };
        g.onmouseleave = () => { tip.hidden = true; g.classList.remove('on'); }; g.onclick = g.onmousemove; }); });
  };

  // ---------- season ----------
  VIEWS.season = () => { const s = st.season || {}; return `<h2>Season</h2><p class="sub">Week 1 of the book opens on the start date, and one new week opens every 7 days after.</p>
    <form class="card" id="sf"><div class="row">
      <div class="grow"><label for="sn">Season name</label><input id="sn" type="text" value="${esc(s.name || '')}" required style="width:100%"></div>
      <div><label for="sd">Start date (Day 1)</label><input id="sd" type="date" value="${esc(s.start_date || '')}" required></div>
      <div><label for="sc">Last day to join</label><input id="sc" type="date" value="${esc(s.join_cutoff || '')}"></div>
      <div><label>&nbsp;</label><button class="btn" type="submit">Save season</button></div></div></form>`; };
  BIND.season = () => { $('sf').onsubmit = e => { e.preventDefault(); run(async () => {
    const v = { name: $('sn').value.trim(), start_date: $('sd').value, join_cutoff: $('sc').value || null };
    if (st.season) Cloud.ok(await c.from('seasons').update(v).eq('id', st.season.id)); else Cloud.ok(await c.from('seasons').insert({ ...v, active: true }));
    await loadTab(true);
  }, 'Season saved.'); }; };

  // ---------- book ----------
  VIEWS.book = () => {
    const ed = st.sections.find(x => x.slug === st.editSlug);
    if (ed) return `<h2>Edit · ${esc(ed.title)}</h2><p class="sub">Paragraphs are &lt;p&gt;, small headings are &lt;p class="label"&gt;, titles are &lt;h3&gt;.</p>
      <form class="card" id="ef"><div class="row">
        <div class="grow"><label for="et">Title</label><input id="et" type="text" value="${esc(ed.title)}" style="width:100%"></div>
        <div><label for="ew">Opens in week</label><select id="ew">${Array.from({ length: 13 }, (_, w) => `<option value="${w}" ${ed.unlock_week === w ? 'selected' : ''}>${w === 0 ? 'Start (available right away)' : 'Week ' + w}</option>`).join('')}</select></div></div>
        <label for="eh" style="margin-top:12px">Text</label><textarea id="eh">${esc(ed.content_html)}</textarea>
        <div class="row" style="margin-top:12px"><button class="btn alt" type="button" id="ecancel">Cancel</button><div class="grow"></div><button class="btn" type="submit">Save section</button></div></form>`;
    const imp = st.importSecs;
    return `<h2>Book</h2><p class="sub">What Will You Give Today? as members read it in the app. Upload an updated Word file to replace the whole book, edit one section, or delete a page members shouldn’t see.</p>
    <div class="card"><div class="row"><div class="grow"><label for="docx">Updated book (.docx)</label><input id="docx" type="file" accept=".docx"></div></div>
    ${imp ? `<div class="ok" style="margin-top:12px">Read ${imp.length} sections from the file: ${imp.filter(x => x.kind === 'week').length} weeks, ${imp.filter(x => x.kind === 'journal').length} journal pages, plus intro and closing pages.${st.sections.some(x => x.hidden) ? ` Pages you deleted (${st.sections.filter(x => x.hidden).map(x => esc(x.title)).join(', ')}) stay deleted.` : ''}</div>
      <div class="row"><button class="btn alt" type="button" id="impCancel">Cancel</button><button class="btn teal" type="button" id="impGo">Replace the book with this file</button></div>` : ''}</div>
    <div class="card tbl">${st.sections.length ? `<table><thead><tr><th>#</th><th>Section</th><th>Opens</th><th>Updated</th><th></th></tr></thead><tbody>
      ${st.sections.map(x => x.hidden
        ? `<tr class="gone"><td class="muted">${x.sort_order}</td><td><s>${esc(x.title)}</s> <span class="pill off">Deleted from app</span></td><td class="muted">—</td><td class="muted">${fDate(x.updated_at)}</td><td class="acts"><button class="btn alt sm" type="button" data-restore="${esc(x.slug)}">Restore</button></td></tr>`
        : `<tr><td class="muted">${x.sort_order}</td><td>${esc(x.title)}</td><td>${x.unlock_week ? 'Week ' + x.unlock_week : 'Start'}</td><td class="muted">${fDate(x.updated_at)}</td><td class="acts"><button class="btn alt sm" type="button" data-edit="${esc(x.slug)}">Edit</button> <button class="btn danger sm" type="button" data-del="${esc(x.slug)}">Delete</button></td></tr>`).join('')}
    </tbody></table>` : `<p class="empty">The book isn’t loaded yet. Upload the Word file above.</p>`}</div>`;
  };
  BIND.book = () => {
    if ($('ef')) {
      $('ecancel').onclick = () => { st.editSlug = null; render(); };
      $('ef').onsubmit = e => { e.preventDefault(); run(async () => {
        Cloud.ok(await c.from('book_sections').update({ title: $('et').value.trim(), unlock_week: parseInt($('ew').value, 10), content_html: $('eh').value, updated_at: new Date().toISOString() }).eq('slug', st.editSlug));
        st.editSlug = null; await loadTab(true);
      }, 'Section saved. Readers see it the next time they open it.'); };
      return;
    }
    $app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { st.editSlug = b.dataset.edit; st.msg = st.err = ''; render(); });
    const setHidden = (slug, on) => run(async () => { Cloud.ok(await c.from('book_sections').update({ hidden: on, updated_at: new Date().toISOString() }).eq('slug', slug)); await loadTab(true); }, on ? 'Deleted. Members no longer see that page.' : 'Restored. Members see that page again.');
    $app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const x = st.sections.find(y => y.slug === b.dataset.del); if (!confirm(`Delete "${x.title}" from the app?\n\nMembers won't see it, and it stays deleted when you upload a new Word file. You can restore it later.`)) return; setHidden(x.slug, true); });
    $app.querySelectorAll('[data-restore]').forEach(b => b.onclick = () => setHidden(b.dataset.restore, false));
    $('docx').onchange = e => { const f = e.target.files[0]; if (!f) return; run(async () => { st.importSecs = await BookImport.fromDocx(f); }); };
    if ($('impCancel')) $('impCancel').onclick = () => { st.importSecs = null; render(); };
    if ($('impGo')) $('impGo').onclick = () => {
      if (!confirm('Replace the whole book in the app with this file? Members see the new text right away.')) return;
      run(async () => {
        const now = new Date().toISOString(), rows = st.importSecs.map(x => ({ ...x, updated_at: now }));
        for (let i = 0; i < rows.length; i += 10) Cloud.ok(await c.from('book_sections').upsert(rows.slice(i, i + 10), { onConflict: 'slug' }));
        const keep = rows.map(r => r.slug), gone = st.sections.filter(x => !keep.includes(x.slug)).map(x => x.slug);
        if (gone.length) Cloud.ok(await c.from('book_sections').delete().in('slug', gone));
        st.importSecs = null; await loadTab(true);
      }, 'The book is updated.');
    };
  };

  // ---------- loading ----------
  async function loadTab(quiet) {
    if (!quiet) st.msg = st.err = '';
    try {
      if (st.tab === 'approvals') await loadChurch();
      if (st.tab === 'groups') await loadGroups();
      if (st.tab === 'messages') { await loadGroups(); st.msgs = st.church ? (await Cloud.rpc('leader_messages', { cid: st.church.church_id }) || []) : []; }
      if (['prices', 'licenses'].includes(st.tab)) st.plans = Cloud.ok(await c.from('license_plans').select('*').order('sort_order'));
      if (['licenses', 'churches', 'season', 'nochurch'].includes(st.tab)) {
        st.season = Cloud.ok(await c.from('seasons').select('*').eq('active', true).maybeSingle());
        st.allChurches = Cloud.ok(await c.from('churches').select('id,name,code,city,state,enrollment_policy,status,kind').neq('status', 'pending').order('name'));
      }
      if (st.tab === 'keys') { const [k, c, p, q] = await Promise.all([Cloud.rpc('admin_book_keys'), Cloud.rpc('admin_key_claims'), Cloud.rpc('admin_print_status'), Cloud.rpc('admin_key_questions')]); st.keys = k || []; st.claims = c || []; st.printStat = p; st.kq = q || []; }
      if (st.tab === 'dash') st.dash = await Cloud.rpc('admin_dashboard');
      if (st.tab === 'payments') st.payments = await Cloud.rpc('admin_payments') || [];
      if (st.tab === 'settings') { st.settings = await Cloud.rpc('admin_settings'); st.stripe = null; Cloud.pay({ action: 'stripe_mode' }).then(r => { st.stripe = r || {}; if (st.tab === 'settings') render(); }).catch(e => { st.stripe = { error: errMsg(e) }; if (st.tab === 'settings') render(); }); }
      if (st.tab === 'nochurch') { const [a, b] = await Promise.all([Cloud.rpc('admin_no_church'), Cloud.rpc('admin_pending_members')]); st.nc = a || []; st.pend = b || []; st.ncSel = new Set(); st.pSel = new Set(); }
      if (st.tab === 'members') { const [a, t] = await Promise.all([Cloud.rpc('admin_all_members'), Cloud.rpc('admin_trials_v2')]); st.all = a || []; st.trials = t || []; }
      if (st.tab === 'amdash') st.amo = await Cloud.rpc('am_overview') || [];
      if (st.tab === 'roles') { const [r, ch] = await Promise.all([Cloud.rpc('admin_roles'), Cloud.rpc('admin_all_churches')]); st.roles = r || []; st.allCh = ch || []; }
      if (st.tab === 'churches') st.ams = await Cloud.rpc('church_account_managers') || [];
      if (st.tab === 'challenges') st.challengesAll = await Cloud.rpc('admin_challenges') || [];
      if (st.tab === 'churches') st.churchAdmins = await Cloud.rpc('admin_church_admins') || [];
      if (st.tab === 'churches') st.orgReqs = await Cloud.rpc('admin_org_requests') || [];
      if (st.tab === 'licenses') {
        st.licenses = st.season ? Cloud.ok(await c.from('church_licenses').select('*').eq('season_id', st.season.id)) : [];
        st.seats = st.admin ? (await Cloud.rpc('admin_individual_seats') || []) : [];
      }
      if (st.tab === 'book') st.sections = Cloud.ok(await c.from('book_sections').select('slug,title,kind,unlock_week,sort_order,content_html,updated_at,hidden').order('sort_order'));
    } catch (e) { flash(errMsg(e), true); }
    render();
  }
  const ADMIN_MODE = new URLSearchParams(location.search).get('panel') === 'admin';
  if (ADMIN_MODE) {
    $('ttl').textContent = 'The 144(P) Plan · Admin Panel'; document.title = 'Admin Panel · The 144(P) Plan';
    try { history.replaceState(null, '', location.pathname.replace(/[^/]*$/, 'admin.html') + location.hash); } catch (e) {}
  }
  async function start() {
    c = await Cloud.sb();
    const s = await Cloud.session();
    if (!s) return signin();
    $('who').textContent = s.user.email; $('out').hidden = false;
    const roles = await Cloud.rpc('my_admin_roles') || [];
    st.admin = roles.some(r => r.role === 'platform_admin');
    st.am = !st.admin && roles.some(r => r.role === 'account_manager');
    st.owner = st.admin ? !!(await Cloud.rpc('my_is_owner')) : false;
    st.churches = await Cloud.rpc('my_leader_churches') || [];
    try { st.notify = await Cloud.rpc('my_notification_settings'); } catch (e) { st.notify = null; }
    try { st.nameOk = await Cloud.rpc('my_profile_complete'); } catch (e) { st.nameOk = true; }
    if (st.admin) { $('ttl').textContent = 'The 144(P) Plan · Admin Panel'; document.title = 'Admin Panel · The 144(P) Plan'; }
    else if (st.am) { $('ttl').textContent = 'The 144(P) Plan · Account Manager'; document.title = 'Account Manager · The 144(P) Plan'; }
    st.church = st.churches[0] || null;
    if (ADMIN_MODE && !st.admin && !st.am) { $app.innerHTML = `<h2>Admin Panel</h2><p class="sub">This page is for the 144(P) Plan administrator. Church admins and group leaders use the <a href="leader.html">Leader Console</a>.</p>`; return; }
    if (!st.churches.length && !st.admin && !st.am) { $app.innerHTML = `<h2>Leader Console</h2><p class="sub">This account isn’t a church admin or group leader yet. Ask your church admin to make you a group leader, then sign in again.</p>`; return; }
    if (st.admin) st.tab = 'dash';
    if (!st.churches.length && st.admin) st.tab = 'churches';
    if (st.am) st.tab = 'amdash';
    let paid = null, payErr = '';
    try { paid = await Cloud.settlePayments(); } catch (x) { payErr = 'We couldn’t confirm the payment yet: ' + ((x && x.message) || '') + ' If you were charged, reload this page in a minute.'; }
    await loadTab();
    if (paid === 'paid') { flash('Payment received. Thank you! Your church’s seats are active.'); render(); }
    else if (paid === 'canceled') { flash('Checkout canceled. You weren’t charged.'); render(); }
    else if (payErr) { flash(payErr, true); render(); }
  }
  function signin() {
    $('nav').hidden = true; document.body.classList.remove('side');
    $app.innerHTML = `<form class="card signin" id="si"><h2>Sign in</h2><p class="sub">Use your 144(P) Plan account.</p>${notes()}
      <label for="em">Email</label><input id="em" type="email" autocomplete="email" required>
      <label for="pw" style="margin-top:10px">Password</label><input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit" style="width:100%;margin-top:16px">Sign in</button>
      <p style="text-align:center;margin:14px 0 0"><a href="reset.html" id="fp" style="font-weight:600">Forgot your password?</a></p></form>`;
    $('fp').onclick = () => { const v = $('em').value.trim(); if (v) $('fp').href = 'reset.html?email=' + encodeURIComponent(v); };
    $('si').onsubmit = async e => { e.preventDefault(); try { await Cloud.signIn($('em').value.trim().toLowerCase(), $('pw').value); st.err = ''; await start(); } catch (x) { st.err = errMsg(x); signin(); } };
  }
  $('out').onclick = async () => { await Cloud.signOut(); location.reload(); };
  start().catch(e => { st.err = errMsg(e); signin(); });
})();
</script>
</body>
</html>
