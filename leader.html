<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leader Console · The 144(P) Plan</title>
<meta name="theme-color" content="#123C56">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<script src="./cloud.js"></script>
<script src="./book-import.js"></script>
<script src="./print-import.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F3F5F6;color:#173344;font-family:'Public Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
a{color:#075D61}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #0E8A7E;outline-offset:2px}
header{background:#123C56;color:#fff;padding:14px 20px}
header .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-family:'Source Serif 4',Georgia,serif;font-size:21px;font-weight:600;flex:1}
header .who{font-size:14px;opacity:.9}
header button{background:none;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
nav{background:#fff;border-bottom:1px solid #E1E7EA}
nav .in{max-width:1080px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 12px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 12px;font-weight:600;color:#4F5F68;cursor:pointer;white-space:nowrap}
nav button[aria-current=page]{color:#123C56;border-bottom-color:#075D61}
main{max-width:1080px;margin:0 auto;padding:20px 20px 60px}
h2{font-family:'Source Serif 4',Georgia,serif;font-weight:600;color:#123C56;font-size:24px;margin:6px 0 4px}
p.sub{margin:4px 0 14px;color:#4F5F68;line-height:1.5}
.card{background:#fff;border:1px solid #E1E7EA;border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
label{font-size:13px;font-weight:600;color:#4F5F68;display:block;margin-bottom:4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{min-height:42px;border:1px solid #9AA8B0;border-radius:8px;padding:8px 10px;background:#fff;color:#173344;font-size:15px}
textarea{width:100%;min-height:320px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.5}
.btn{min-height:42px;border:0;border-radius:8px;background:#123C56;color:#fff;font-weight:600;padding:0 16px;cursor:pointer}
.btn.teal{background:#075D61}
.btn.alt{background:#fff;color:#123C56;border:1px solid #123C56}
.btn.danger{background:#fff;color:#A33A2E;border:1px solid #A33A2E}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px}
.btn[disabled]{background:#C9D2D7;color:#fff;border-color:#C9D2D7;cursor:default}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#4F5F68;font-weight:700;padding:8px;border-bottom:2px solid #E1E7EA}
td{padding:10px 8px;border-bottom:1px solid #EEF1F2;vertical-align:middle}
td input[type=text],td input[type=number],td select{min-height:36px;width:100%}
.tbl{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.ok{background:#E8F5F3;color:#075D61}.pill.wait{background:#FFF4DC;color:#6B4E12}.pill.off{background:#EEF1F2;color:#4F5F68}
.seatbar{height:10px;border-radius:5px;background:#E1E7EA;overflow:hidden;margin-top:8px}
.seatbar span{display:block;height:100%;background:#075D61}
.err{background:#FBEAE7;color:#7A2A20;border-radius:8px;padding:10px 12px;margin-bottom:14px}
.ok{background:#E8F5F3;color:#075D61;border-radius:8px;padding:10px 12px;margin-bottom:14px}
.empty{color:#4F5F68;padding:14px 4px}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:18px;letter-spacing:.08em;background:#F3F5F6;border-radius:8px;padding:4px 10px}
.check{width:20px;height:20px;accent-color:#075D61}
.sticky{position:sticky;bottom:0;background:#fff;border-top:1px solid #E1E7EA;padding:12px 0 0;margin-top:8px}
.signin{max-width:420px;margin:40px auto}
.signin input{width:100%}
.muted{color:#4F5F68;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.church .qr{flex:none;width:150px;height:150px;border:1px solid #E1E7EA;border-radius:8px;padding:4px;background:#fff}
.church .qr svg{width:100%;height:100%;display:block}
.church .link{font-size:13px;color:#4F5F68;word-break:break-all;background:#F3F5F6;border-radius:8px;padding:6px 10px}
.church .admins{border-top:1px solid #E1E7EA;margin-top:14px;padding-top:12px}
.church .admins ul{list-style:none;padding:0;margin:8px 0}
.church .admins li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;flex-wrap:wrap}
tr.gone td{color:#7A8890}
td.acts{white-space:nowrap}
header .hlink{color:#fff;font-weight:600;text-decoration:none;margin-right:14px;font-size:14px}
.grp .mlist{list-style:none;padding:0;margin:10px 0 0}
.mlist{list-style:none;padding:0;margin:6px 0 0}
.mlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #EEF1F2;flex-wrap:wrap}
.addbox{border:1px solid #CFE3E0;background:#F7FBFA;border-radius:10px;padding:12px;margin-top:12px}
.pick{display:flex;gap:10px;align-items:center;margin:0;padding:8px 2px;font-weight:500;color:#173344;border-bottom:1px solid #EEF1F2;cursor:pointer}
.pick.all{font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.tile{background:#fff;border:1px solid #E1E7EA;border-radius:14px;padding:14px}
.tile.warn{border-color:#D9A62B;background:#FFF8E6}
.tile .tl{font-size:13px;color:#4F5F68;font-weight:600}
.tile .tv{font-size:28px;font-weight:700;color:#123C56;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.tile .ts{font-size:12.5px;color:#4F5F68;line-height:1.45}
h3.dh{margin:22px 0 10px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#4F5F68}
.meter{display:block;height:6px;border-radius:3px;background:#E8EEF1;margin:4px 0 6px;overflow:hidden}
.meter span{display:block;height:100%;background:#123C56;border-radius:3px}
.chart .cw{position:relative;margin-top:8px}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{font-size:11px;fill:#6A7A84}
.chart .pk{font-size:11px;fill:#173344;font-weight:700}
.chart .bar.on path{fill:#2A62A6}
.chart .tip{position:absolute;background:#173344;color:#fff;font-size:12.5px;padding:6px 8px;border-radius:6px;pointer-events:none;white-space:nowrap}
table.mini{font-size:13px;margin-top:6px}
table.mini td{padding:3px 12px 3px 0}
</style>
</head>
<body>
<header><div class="in"><h1 id="ttl">The 144(P) Plan · Leader Console</h1><a class="hlink" href="challenges.html">Challenges</a><span class="who" id="who"></span><button id="out" type="button" hidden>Sign out</button></div></header>
<nav id="nav" hidden><div class="in" id="tabs"></div></nav>
<main id="app" aria-live="polite"><p class="sub">Loading…</p></main>
<script>
(function () {
  const $ = id => document.getElementById(id), $app = $('app');
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const money = n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fDate = d => d ? new Date(String(d).slice(0, 10) + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
  const errMsg = e => (e && (e.message || e.error_description)) || 'Something went wrong. Please try again.';
  const STATUS = { pending_payment: ['Waiting for payment', 'wait'], active: ['Active', 'ok'], canceled: ['Canceled', 'off'] };
  const pill = s => { const [t, c] = STATUS[s] || [s || 'None', 'off']; return `<span class="pill ${c}">${esc(t)}</span>`; };
  const st = { tab: 'approvals', admin: false, churches: [], church: null, members: [], seat: null, sel: new Set(), msg: '', err: '', plans: [], season: null, licenses: [], allChurches: [], churchAdmins: [], challengesAll: [], dash: null, keys: [], claims: [], printStat: null, printPrev: null, printBusy: '', msgs: [], msgDraft: '', msgTo: '', payments: [], buy: false, buyOpts: null, buySeats: "", groups: [], roster: [], gAdd: null, gSel: new Set(), gRename: null, seats: [], sections: [], editSlug: null, importSecs: null };
  let c = null;

  const flash = (m, isErr) => { if (isErr) { st.err = m; st.msg = ''; } else { st.msg = m; st.err = ''; } };
  const notes = () => (st.err ? `<div class="err" role="alert">${esc(st.err)}</div>` : '') + (st.msg ? `<div class="ok" role="status">${esc(st.msg)}</div>` : '');
  async function run(fn, okMsg) { try { await fn(); if (okMsg) flash(okMsg); } catch (e) { flash(errMsg(e), true); } render(); }

  // ---------- tabs ----------
  const TABS = () => [['approvals', 'Approvals'], ['groups', 'Groups'], ['messages', 'Messages'], ...(st.admin ? [['dash', 'Dashboard'], ['prices', 'Prices'], ['licenses', 'Licenses'], ['churches', 'Churches'], ['season', 'Season'], ['book', 'Book'], ['keys', 'Book keys'], ['challenges', 'Challenges'], ['payments', 'Payments']] : [])];
  function renderNav() {
    $('nav').hidden = false;
    $('tabs').innerHTML = TABS().map(([k, t]) => `<button type="button" data-tab="${k}" ${st.tab === k ? 'aria-current="page"' : ''}>${t}</button>`).join('');
    $('tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = async () => { st.tab = b.dataset.tab; st.msg = st.err = ''; await loadTab(); });
  }
  function render() { renderNav(); $app.innerHTML = notes() + (VIEWS[st.tab] || VIEWS.approvals)(); (BIND[st.tab] || (() => {}))(); }

  // ---------- approvals ----------
  async function loadChurch() {
    if (!st.church) return;
    const [mem, seat] = await Promise.all([Cloud.rpc('leader_members', { cid: st.church.church_id }), Cloud.rpc('church_seat_status', { cid: st.church.church_id })]);
    st.members = mem || []; st.seat = (seat && seat[0]) || null; st.sel = new Set();
    st.invoices = [];
    if (canName()) {
      try { st.invoices = (await Cloud.rpc('church_invoices', { cid: st.church.church_id })) || []; } catch (e) { st.invoices = []; }
      // An invoice may have been paid since we last looked: ask Stripe, then reload once
      if (st.invoices.some(i => i.status === 'open') && !st.invoiceSynced) {
        st.invoiceSynced = true;
        try { const r = await Cloud.pay({ action: 'sync_invoices' }); if (Object.values((r && r.checked) || {}).includes('paid')) return loadChurch(); } catch (e) {}
      }
    }
  }
  const canName = () => st.church && (st.church.role === 'church_admin' || st.church.role === 'platform_admin');
  const VIEWS = {}, BIND = {};
  VIEWS.approvals = () => {
    if (!st.churches.length) return `<h2>Approvals</h2><p class="sub">You aren’t a leader for any church yet. Your church admin can make you a group leader.</p>`;
    const pend = st.members.filter(m => m.status === 'pending'), ver = st.members.filter(m => m.status === 'verified');
    const s = st.seat || {}, cap = s.seats || 0, used = s.used || ver.length, left = cap ? cap - used : null;
    const all = pend.length > 0 && pend.every(m => st.sel.has(m.membership_id));
    const ns = st.notify;
    const emailCard = ns ? `<div class="card"><label class="pick" style="border:0;padding:0"><input type="checkbox" class="check" id="nsNew" ${ns.email_new_members ? 'checked' : ''}> <span><strong>Email me about new members</strong><br><span class="muted">${st.admin ? 'New accounts, join requests at every church, payments and new churches' : 'Each time someone asks to join your church'}, sent to ${esc(ns.email || 'your account email')}.</span></span></label></div>` : '';
    const nameCard = st.nameOk === false ? `<div class="card" style="border-color:#D9A62B;background:#FFF8E6"><strong>Add your full name.</strong> Members see your name on messages and approvals. Open <a href="./">the app</a> › More › My Account, enter your first and last name, and tap Save changes.</div>` : '';
    return `<h2>Approvals</h2><p class="sub">Approve people who belong to your church. Approved members can read the book and count toward your church’s score.</p>${nameCard}${emailCard}
      <div class="card"><div class="row">
        ${st.churches.length > 1 ? `<div><label for="ch">Church</label><select id="ch">${st.churches.map(x => `<option value="${x.church_id}" ${x.church_id === st.church.church_id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>` : `<div><label>Church</label><strong>${esc(st.church.name)}</strong></div>`}
        <div class="grow"></div>
        <div><label>Church code to share</label><span class="code">${esc(st.church.code)}</span></div>
      </div>
      <div style="margin-top:14px">${cap ? `<strong>${used} of ${cap}</strong> seats used · ${esc(s.plan_name || '')} license ${pill(s.license_status)}${s.expires_at ? ` <span class="muted">· good through ${fDate(s.expires_at)}</span>` : ''}<div class="seatbar" aria-hidden="true"><span style="width:${Math.min(100, Math.round(used / cap * 100))}%"></span></div>` : `<span class="muted">No book license for ${esc(s.season_name || 'this season')} yet. You can still approve members; the book opens once a license is active.</span>`}</div>
      ${invoiceList()}
      ${canName() ? (st.buy ? buyBox() : `<button class="btn teal" type="button" id="buyOpen" style="margin-top:12px">${s.license_status === 'active' ? 'Add seats' : 'Buy seats for your church'}</button>`) : ''}</div>

      <div class="card"><div class="row"><h3 style="margin:0;font-size:18px" class="grow">Waiting for approval (${pend.length})</h3></div>
      ${pend.length ? `<div class="tbl"><table><thead><tr>
          <th style="width:44px"><input type="checkbox" class="check" id="all" ${all ? 'checked' : ''} aria-label="Select all ${pend.length} people waiting"></th>
          <th>Name</th><th>Email</th><th>Asked</th><th style="width:190px"><span class="sr">Actions</span></th></tr></thead><tbody>
        ${pend.map(m => `<tr><td><input type="checkbox" class="check" data-sel="${m.membership_id}" ${st.sel.has(m.membership_id) ? 'checked' : ''} aria-label="Select ${esc(m.name)}"></td>
          <td><strong>${esc(m.name)}</strong>${m.same_name ? `<br><span class="pill wait" title="Another member of this church has the same name. Check the email to be sure it's a different person.">Same name as ${m.same_name} other${m.same_name === 1 ? '' : 's'} · check email</span>` : ''}</td><td>${esc(m.email)}</td><td>${fDate(m.joined_at)}</td>
          <td><div class="row"><button class="btn teal sm" type="button" data-ap="${m.membership_id}">Approve</button><button class="btn danger sm" type="button" data-dc="${m.membership_id}">Decline</button></div></td></tr>`).join('')}
        </tbody></table></div>
        <div class="sticky row"><span class="muted grow">${st.sel.size} selected${left != null ? ` · ${left} seats left` : ''}</span>
          <button class="btn danger" type="button" id="dcSel" ${st.sel.size ? '' : 'disabled'}>Decline selected</button>
          <button class="btn teal" type="button" id="apSel" ${st.sel.size ? '' : 'disabled'}>Approve selected (${st.sel.size})</button></div>`
        : `<p class="empty">No one is waiting. New requests appear here when people enter your church code in the app.</p>`}</div>

      <div class="card"><h3 style="margin:0 0 8px;font-size:18px">Approved members (${ver.length})</h3>
      ${ver.length ? `<div class="tbl"><table><thead><tr><th>Name</th><th>Email</th><th>Can approve new members</th></tr></thead><tbody>
        ${ver.map(m => `<tr><td>${esc(m.name)}${m.same_name ? `<br><span class="pill wait" title="Another member of this church has the same name. Check the email to be sure it's a different person.">Same name as ${m.same_name} other${m.same_name === 1 ? '' : 's'} · check email</span>` : ''}</td><td>${esc(m.email)}</td><td>${canName() ? `<label style="display:flex;gap:8px;align-items:center;margin:0;color:#173344;font-weight:500"><input type="checkbox" class="check" data-ld="${m.membership_id}" ${m.is_leader ? 'checked' : ''}> Can approve members</label>` : (m.is_leader ? 'Yes' : '—')}</td></tr>`).join('')}
        </tbody></table></div>` : `<p class="empty">No approved members yet.</p>`}</div>`;
  };
  function buyBox() {
    const o = st.buyOpts;
    if (!o) return `<div class="addbox"><p class="muted">Loading prices…</p></div>`;
    const cur = o.current && o.current.status === 'active' ? o.current : null;
    const T = o.tiers || [], nf = n => Number(n).toLocaleString('en-US');
    const min = cur ? 1 : (o.min_seats || 5), have = cur ? cur.seats : 0, room = (o.max_seats || 0) - have;
    const n = parseInt(st.buySeats, 10), total = have + (n || 0);
    const tier = n > 0 ? T.find(t => total >= t.min && total <= t.max) : null;
    let note = '';
    if (st.buySeats !== '' && st.buySeats != null) {
      if (!(n >= min)) note = cur ? 'Enter at least 1 seat.' : `The smallest purchase is ${min} seats.`;
      else if (n > room) note = `For more than ${nf(o.max_seats)} seats in total, contact us and we’ll set it up.`;
      else if (!tier) note = 'Seats aren’t available for that number right now.';
    }
    const ok = tier && !note, big = ok && o.invoice_min && n * tier.rate >= Number(o.invoice_min);
    return `<div class="addbox"><div class="row"><strong class="grow">${cur ? `Add seats · you have ${nf(cur.seats)}` : 'Buy seats for your church'}</strong><button class="btn alt sm" type="button" id="buyClose">Close</button></div>
      <p class="muted" style="margin:6px 0 10px">${cur ? `Added seats cost the rate for your new total and end on ${cur.expires_at ? fDate(cur.expires_at) : 'the same date as your others'}.` : 'One payment, good for one year from today. Members you approve read free.'} Prices include tax. All sales are final.</p>
      <div class="tbl"><table><thead><tr><th>Seats in total</th><th>Price per seat</th></tr></thead><tbody>${T.map((t, i) => `<tr${tier && tier.id === t.id ? ' style="background:#E6F2F2;font-weight:700"' : ''}><td>${esc(t.name)} · ${i === T.length - 1 ? nf(t.min) + '+' : nf(t.min) + '–' + nf(t.max)}</td><td>${money(t.rate)}</td></tr>`).join('')}</tbody></table></div>
      <label for="buyN" style="margin-top:12px;display:block;font-weight:600">${cur ? 'How many more seats?' : 'How many seats?'}</label>
      <input id="buyN" type="number" inputmode="numeric" min="${min}" step="1" value="${esc(st.buySeats || '')}" placeholder="${cur ? 'e.g. 10' : 'At least ' + min}" style="max-width:200px">
      ${note ? `<p class="err" style="margin-top:8px">${esc(note)}</p>` : ''}
      ${ok ? `<p style="margin:10px 0 0;font-size:17px"><strong>${nf(n)} seat${n === 1 ? '' : 's'} × ${money(tier.rate)} = ${money(n * tier.rate)}</strong>${cur ? ` <span class="muted">· ${nf(total)} seats in total</span>` : ''}</p>` : ''}
      ${big && o.open_invoice ? `<p class="muted" style="margin-top:10px">Invoice ${esc(o.open_invoice.number || '')} for ${money(o.open_invoice.amount)} is already waiting for payment. You can pay this one by card, or wait until that invoice is paid to ask for another.</p>` : ''}
      ${big && !o.open_invoice ? `<div class="two" style="margin-top:10px;gap:10px;display:grid;grid-template-columns:1fr 1fr">
          <button class="btn teal" type="button" id="buyInv" ${st.invBusy ? 'disabled' : ''}>${st.invBusy ? 'Creating your invoice…' : 'Send me an invoice'}</button>
          <button class="btn alt" type="button" id="buyGo" style="margin-top:0">Pay by card now</button></div>
        <p class="muted" style="margin-top:6px;font-size:13px">Purchases of ${money(o.invoice_min)} or more can be paid by invoice. We email it to you from Stripe. Pay within ${o.invoice_days || 15} days by bank transfer (wire or ACH, using the account details on the invoice) or by card. Your seats turn on as soon as the payment arrives.</p>`
      : `<button class="btn teal" type="button" id="buyGo" ${ok ? '' : 'disabled'} style="margin-top:10px">Continue to secure checkout</button><p class="muted" style="margin-top:6px;font-size:13px">You’ll pay on Stripe’s secure page (card, Apple Pay or Google Pay), then come back here.${o.invoice_min ? ` Spending ${money(o.invoice_min)} or more? You can ask for an invoice and pay by bank transfer.` : ''}</p>`}</div>`;
  }
  function invoiceList() {
    const L = (st.invoices || []).filter(i => i.status === 'open' || i.status === 'paid');
    if (!L.length) return '';
    return L.map(i => { const late = i.status === 'open' && i.due_date && i.due_date < new Date().toISOString().slice(0, 10);
      return `<div class="card" style="margin:12px 0 0;${i.status === 'open' ? 'border-color:#D9A62B;background:#FFF8E6' : ''}"><div class="row"><div class="grow"><strong>Invoice ${esc(i.number || '')} · ${money(i.amount)}</strong> ${i.status === 'paid' ? '<span class="pill ok">Paid</span>' : late ? '<span class="pill off">Past due</span>' : '<span class="pill wait">Waiting for payment</span>'}<br>
        <span class="muted">${esc(i.description)}${i.status === 'open' && i.due_date ? ` · due ${fDate(i.due_date + 'T12:00:00')}` : ''}</span>
        ${i.status === 'open' ? '<br><span class="muted">These seats turn on as soon as the payment arrives. Bank transfers can take 1–3 business days to arrive.</span>' : ''}</div>
        ${i.url ? `<a class="btn ${i.status === 'open' ? 'teal' : 'alt'} sm" href="${esc(i.url)}" target="_blank" rel="noopener">${i.status === 'open' ? 'View or pay invoice' : 'View invoice'}</a>` : ''}</div></div>`; }).join('');
  }
  BIND.approvals = () => {
    if ($('nsNew')) $('nsNew').onchange = e => { const on = e.target.checked; run(async () => { await Cloud.rpc('set_notification_settings', { p_new_members: on }); st.notify.email_new_members = on; }, on ? 'You’ll get an email when someone new signs up.' : 'New-member emails turned off.'); };
    if ($('buyOpen')) $('buyOpen').onclick = () => run(async () => { st.buy = true; st.buySeats = ''; st.buyOpts = null; render(); st.buyOpts = await Cloud.rpc('purchase_options', { cid: st.church.church_id }); });
    if ($('buyClose')) $('buyClose').onclick = () => { st.buy = false; render(); };
    if ($('buyN')) $('buyN').oninput = e => { if (st.buySeats === e.target.value) return; st.buySeats = e.target.value; const pos = e.target.selectionStart; render(); const i = $('buyN'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) {} } };
    if ($('buyInv')) $('buyInv').onclick = () => { if (!confirm(`Send an invoice for ${parseInt(st.buySeats, 10).toLocaleString()} seats to your email? Your seats turn on when it’s paid.`)) return;
      st.invBusy = true; render();
      run(async () => { try { const r = await Cloud.pay({ action: 'invoice', type: 'church', church_id: st.church.church_id, seats: parseInt(st.buySeats, 10) }); st.buy = false; await loadChurch(); flash(`Invoice ${r.number || ''} is on its way to your email. You can also open it here.`); } finally { st.invBusy = false; } }); };
    if ($('buyGo')) $('buyGo').onclick = () => { const b = $('buyGo'); b.disabled = true; b.textContent = 'Opening secure checkout…'; run(async () => { await Cloud.checkout('church', { church_id: st.church.church_id, seats: parseInt(st.buySeats, 10) }); }); };
    if ($('ch')) $('ch').onchange = e => run(async () => { st.church = st.churches.find(x => x.church_id === e.target.value); await loadChurch(); });
    const pend = st.members.filter(m => m.status === 'pending');
    if ($('all')) $('all').onchange = e => { st.sel = e.target.checked ? new Set(pend.map(m => m.membership_id)) : new Set(); st.msg = st.err = ''; render(); };
    $app.querySelectorAll('[data-sel]').forEach(b => b.onchange = () => { const id = b.dataset.sel; st.sel.has(id) ? st.sel.delete(id) : st.sel.add(id); st.msg = st.err = ''; render(); });
    const approve = ids => run(async () => { const n = await Cloud.rpc('approve_memberships', { p_ids: ids }); await loadChurch(); flash(`Approved ${n} ${n === 1 ? 'person' : 'people'}.`); });
    const decline = ids => { if (!confirm(`Decline ${ids.length === 1 ? 'this request' : ids.length + ' requests'}? They can ask again with the church code.`)) return; run(async () => { const n = await Cloud.rpc('decline_memberships', { p_ids: ids }); await loadChurch(); flash(`Declined ${n}.`); }); };
    $app.querySelectorAll('[data-ap]').forEach(b => b.onclick = () => approve([b.dataset.ap]));
    $app.querySelectorAll('[data-dc]').forEach(b => b.onclick = () => decline([b.dataset.dc]));
    if ($('apSel')) $('apSel').onclick = () => approve([...st.sel]);
    if ($('dcSel')) $('dcSel').onclick = () => decline([...st.sel]);
    $app.querySelectorAll('[data-ld]').forEach(b => b.onchange = () => run(async () => { await Cloud.rpc('set_group_leader', { p_membership: b.dataset.ld, p_on: b.checked }); await loadChurch(); }, b.checked ? 'Group leader added.' : 'Group leader removed.'));
  };

  // ---------- prices ----------
  VIEWS.prices = () => `<h2>Prices</h2><p class="sub">The individual price is for one person for a year. Church rows are price levels: a church whose total seats fall between the From and To numbers pays that price for <strong>each seat</strong>. The lowest From number is the smallest purchase. A price change applies to new purchases; seats already bought keep their price.</p>
    <div class="card tbl"><table><thead><tr><th>Name</th><th>Type</th><th>From (seats)</th><th>To (seats)</th><th>Price</th><th>Offered</th><th></th></tr></thead><tbody>
    ${st.plans.map(p => `<tr data-plan="${p.id}">
      <td><input type="text" data-f="name" value="${esc(p.name)}" aria-label="Plan name"></td>
      <td><select data-f="kind" aria-label="Type"><option value="individual" ${p.kind === 'individual' ? 'selected' : ''}>Individual</option><option value="church" ${p.kind === 'church' ? 'selected' : ''}>Church</option></select></td>
      <td><input type="number" min="1" data-f="min_seats" value="${p.min_seats || 1}" aria-label="From seats" ${p.kind === 'individual' ? 'disabled' : ''}></td>
      <td><input type="number" min="1" data-f="seat_limit" value="${p.seat_limit}" aria-label="To seats" ${p.kind === 'individual' ? 'disabled' : ''}></td>
      <td><input type="number" min="0" step="0.01" data-f="price" value="${Number(p.price).toFixed(2)}" aria-label="Price in dollars"><div class="muted" style="font-size:12px">${p.kind === 'church' ? 'per seat' : 'per person'}</div></td>
      <td><input type="checkbox" class="check" data-f="active" ${p.active ? 'checked' : ''} aria-label="Offered"></td>
      <td><button class="btn sm" type="button" data-save="${p.id}">Save</button></td></tr>`).join('')}
    </tbody></table>
    <div class="row" style="margin-top:12px"><button class="btn alt" type="button" id="addPlan">Add a price option</button></div></div>
    <p class="muted">Keep the church levels from overlapping, with no gaps between them. Example: 5–999, 1,000–4,999, 5,000–19,999.</p>`;
  BIND.prices = () => {
    const read = tr => { const g = f => tr.querySelector(`[data-f="${f}"]`); const ind = g('kind').value === 'individual'; return { name: g('name').value.trim(), kind: g('kind').value, min_seats: ind ? 1 : parseInt(g('min_seats').value, 10), seat_limit: ind ? 1 : parseInt(g('seat_limit').value, 10), price: parseFloat(g('price').value), active: g('active').checked, updated_at: new Date().toISOString() }; };
    $app.querySelectorAll('[data-save]').forEach(b => b.onclick = () => run(async () => {
      const v = read(b.closest('tr')); if (!v.name || !(v.min_seats > 0) || !(v.seat_limit >= v.min_seats) || !(v.price >= 0)) throw new Error('Each row needs a name, a From number above zero, a To number at least as big, and a price.');
      Cloud.ok(await c.from('license_plans').update(v).eq('id', b.dataset.save)); await loadTab(true);
    }, 'Price saved.'));
    $('addPlan').onclick = () => run(async () => { Cloud.ok(await c.from('license_plans').insert({ name: 'New level', kind: 'church', min_seats: 100001, seat_limit: 200000, price: 7, active: false, sort_order: st.plans.length + 1 })); await loadTab(true); }, 'Added. Set it up and check Offered when it’s ready.');
  };

  // ---------- licenses ----------
  VIEWS.licenses = () => {
    const churchPlans = st.plans.filter(p => p.kind === 'church' && p.active);
    const lic = id => st.licenses.find(l => l.church_id === id);
    return `<h2>Licenses · ${esc(st.season ? st.season.name : 'No active season')}</h2><p class="sub">Give each church a license for the season. The book opens for its approved members when the license is Active.</p>
    <div class="card tbl">${st.allChurches.length ? `<table><thead><tr><th>Church</th><th>Price level</th><th>Seats</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody>
      ${st.allChurches.map(ch => { const l = lic(ch.id) || {}; return `<tr data-ch="${ch.id}">
        <td><strong>${esc(ch.name)}</strong><br><span class="muted">Code ${esc(ch.code)}</span></td>
        <td><select data-f="plan_id" aria-label="License option"><option value="">Choose…</option>${churchPlans.map(p => `<option value="${p.id}" data-min="${p.min_seats || 1}" data-price="${p.price}" ${l.plan_id === p.id ? 'selected' : ''}>${esc(p.name)} · ${money(p.price)} a seat</option>`).join('')}</select></td>
        <td><input type="number" min="1" data-f="seats" value="${l.seats || ''}" aria-label="Seats"></td>
        <td><input type="number" min="0" step="0.01" data-f="price" value="${l.price != null ? Number(l.price).toFixed(2) : ''}" aria-label="Price"></td>
        <td><select data-f="status" aria-label="Status">${Object.entries(STATUS).map(([k, [t]]) => `<option value="${k}" ${(l.status || 'pending_payment') === k ? 'selected' : ''}>${t}</option>`).join('')}</select></td>
        <td><button class="btn sm" type="button" data-savelic="${ch.id}">Save</button></td></tr>`; }).join('')}
      </tbody></table>` : `<p class="empty">No churches yet. Add one in the Churches tab.</p>`}</div>
    <h2 style="font-size:20px">Individual seats</h2>
    <div class="card tbl">${st.seats.length ? `<table><thead><tr><th>Name</th><th>Email</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody>
      ${st.seats.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${money(x.price)}</td><td>${pill(x.status)}</td>
        <td><div class="row">${x.status !== 'active' ? `<button class="btn teal sm" type="button" data-seat="${x.seat_id}" data-to="active">Mark paid</button>` : ''}${x.status !== 'canceled' ? `<button class="btn danger sm" type="button" data-seat="${x.seat_id}" data-to="canceled">Cancel</button>` : ''}</div></td></tr>`).join('')}
      </tbody></table>` : `<p class="empty">No individual seat requests yet.</p>`}</div>`;
  };
  BIND.licenses = () => {
    $app.querySelectorAll('[data-ch] select[data-f="plan_id"]').forEach(sel => sel.onchange = () => {
      const o = sel.selectedOptions[0], tr = sel.closest('tr'); if (!o || !o.dataset.price) return;
      const n = tr.querySelector('[data-f="seats"]'); if (!(parseInt(n.value, 10) > 0)) n.value = o.dataset.min;
      tr.querySelector('[data-f="price"]').value = (parseInt(n.value, 10) * Number(o.dataset.price)).toFixed(2);
    });
    $app.querySelectorAll('[data-ch] input[data-f="seats"]').forEach(inp => inp.oninput = () => {
      const tr = inp.closest('tr'), o = tr.querySelector('[data-f="plan_id"]').selectedOptions[0];
      if (o && o.dataset.price && parseInt(inp.value, 10) > 0) tr.querySelector('[data-f="price"]').value = (parseInt(inp.value, 10) * Number(o.dataset.price)).toFixed(2);
    });
    $app.querySelectorAll('[data-savelic]').forEach(b => b.onclick = () => run(async () => {
      if (!st.season) throw new Error('Set up an active season first.');
      const tr = b.closest('tr'), g = f => tr.querySelector(`[data-f="${f}"]`);
      const v = { church_id: b.dataset.savelic, season_id: st.season.id, plan_id: g('plan_id').value || null, seats: parseInt(g('seats').value, 10), price: parseFloat(g('price').value), status: g('status').value, updated_at: new Date().toISOString() };
      if (!(v.seats > 0) || !(v.price >= 0)) throw new Error('Choose an option, or enter seats and a price.');
      Cloud.ok(await c.from('church_licenses').upsert(v, { onConflict: 'church_id,season_id' })); await loadTab(true);
    }, 'License saved.'));
    $app.querySelectorAll('[data-seat]').forEach(b => b.onclick = () => run(async () => { Cloud.ok(await c.from('individual_seats').update({ status: b.dataset.to }).eq('id', b.dataset.seat)); await loadTab(true); }, 'Seat updated.'));
  };

  // ---------- groups ----------
  async function loadGroups() {
    if (!st.church) { st.groups = []; st.roster = []; return; }
    const [g, r] = await Promise.all([Cloud.rpc('church_groups', { cid: st.church.church_id }), Cloud.rpc('group_roster', { cid: st.church.church_id })]);
    st.groups = g || []; st.roster = r || [];
    try { st.leadReqs = canName() ? (await Cloud.rpc('group_lead_requests_for', { cid: st.church.church_id }) || []) : []; } catch (e) { st.leadReqs = []; }
    if (st.gAdd && !st.groups.some(x => x.group_id === st.gAdd)) st.gAdd = null;
  }
  const boss = () => canName();
  VIEWS.groups = () => {
    if (!st.church) return `<h2>Groups</h2><p class="sub">Add a church first in the Churches tab.</p>`;
    const G = st.groups, R = st.roster, gname = id => (G.find(g => g.group_id === id) || {}).name;
    const free = R.filter(m => !m.group_id);
    const picker = st.churches.length > 1 ? `<div><label for="gch">Church</label><select id="gch">${st.churches.map(x => `<option value="${x.church_id}" ${x.church_id === st.church.church_id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>` : `<div><label>Church</label><strong>${esc(st.church.name)}</strong></div>`;
    const mine = G.find(g => g.i_lead);
    const card = g => {
      const mem = R.filter(m => m.group_id === g.group_id), adding = st.gAdd === g.group_id;
      const pool = boss() ? R.filter(m => m.group_id !== g.group_id) : free;
      const allOn = pool.length > 0 && pool.every(m => st.gSel.has(m.membership_id));
      return `<div class="card grp">
        <div class="row">
          ${st.gRename === g.group_id ? `<form class="row grow" data-rn="${g.group_id}"><label class="sr" for="rn-${g.group_id}">Group name</label><input id="rn-${g.group_id}" type="text" maxlength="60" value="${esc(g.name)}" required style="flex:1;min-width:180px"><button class="btn sm" type="submit">Save</button><button class="btn alt sm" type="button" data-rncx>Cancel</button></form>`
            : `<h3 class="grow" style="margin:0;font-size:19px">${esc(g.name)} <span class="muted" style="font-weight:500;font-size:14px">· ${g.members} member${g.members === 1 ? '' : 's'}</span>${g.i_lead ? ' <span class="pill ok">You lead this group</span>' : ''}</h3>
              ${boss() ? `<button class="btn alt sm" type="button" data-rename="${g.group_id}">Rename</button><button class="btn danger sm" type="button" data-gdel="${g.group_id}">Delete</button>` : ''}`}
        </div>
        <div class="row" style="margin-top:10px">${boss() ? `<label for="ld-${g.group_id}" style="margin:0">Group leader</label>
            <select id="ld-${g.group_id}" data-lead="${g.group_id}"><option value="">No leader yet</option>${R.map(m => `<option value="${m.partner_id}" ${m.partner_id === g.leader_partner_id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>`
          : `<span><strong>Group leader:</strong> ${esc(g.leader_name || 'None yet')}</span>`}</div>
        ${mem.length ? `<ul class="mlist">${mem.map(m => `<li><span><strong>${esc(m.name)}</strong>${m.partner_id === g.leader_partner_id ? ' <span class="pill ok">Leader</span>' : ''} <span class="muted">${esc(m.email)}</span></span>
            ${g.can_edit && !(g.i_lead && !boss() && m.partner_id === g.leader_partner_id) ? `<button class="btn danger sm" type="button" data-out="${m.membership_id}" data-nm="${esc(m.name)}" data-g="${esc(g.name)}">Remove</button>` : ''}</li>`).join('')}</ul>`
          : `<p class="empty">No members in this group yet.</p>`}
        ${g.can_edit ? (adding ? `<div class="addbox"><div class="row"><strong class="grow">Add members to ${esc(g.name)}</strong><button class="btn alt sm" type="button" data-addcx>Close</button></div>
            ${pool.length ? `<label class="pick all"><input type="checkbox" class="check" id="gAll" ${allOn ? 'checked' : ''}> Select all (${pool.length})</label>
              ${pool.map(m => `<label class="pick"><input type="checkbox" class="check" data-pick="${m.membership_id}" ${st.gSel.has(m.membership_id) ? 'checked' : ''}> <span>${esc(m.name)} <span class="muted">${esc(m.email)}${m.group_id ? ' · now in ' + esc(gname(m.group_id)) : ''}</span></span></label>`).join('')}
              <button class="btn teal" type="button" data-addgo="${g.group_id}" ${st.gSel.size ? '' : 'disabled'}>Add selected (${st.gSel.size})</button>`
            : `<p class="empty">${boss() ? 'Every approved member is already in this group.' : 'Everyone is already in a group. Members appear here after they’re approved and before they’re placed in a group.'}</p>`}</div>`
          : `<button class="btn teal sm" type="button" data-add="${g.group_id}" style="margin-top:10px">Add members</button>`) : ''}
      </div>`;
    };
    const LR = st.leadReqs || [];
    const reqCard = LR.length ? `<div class="card" style="border-color:#D9A62B;background:#FFF8E6"><h3 style="margin:0 0 6px;font-size:18px">Group leader requests (${LR.length})</h3>${LR.map(r => `<div style="border-top:1px solid #F1D8A0;padding:10px 0">
        <strong>${esc(r.name)}</strong> <span class="muted">${esc(r.email)}</span> wants to lead <strong>${esc(r.group_name)}</strong>${r.member_status === 'pending' ? ' <span class="pill wait">Also waiting to join</span>' : ''}${r.note ? `<br><em>${esc(r.note)}</em>` : ''}
        <div class="row" style="margin-top:8px"><label for="lr-${r.id}" style="margin:0">Group</label><select id="lr-${r.id}"><option value="">New group: ${esc(r.group_name)}</option>${G.map(g => `<option value="${g.group_id}">${esc(g.name)}${g.leader_name ? ' (led by ' + esc(g.leader_name) + ')' : ''}</option>`).join('')}</select>
        <button class="btn teal sm" type="button" data-lrok="${r.id}">Approve</button><button class="btn danger sm" type="button" data-lrno="${r.id}">Decline</button></div></div>`).join('')}</div>` : '';
    return reqCard + `<h2>Groups</h2><p class="sub">Groups are smaller circles inside your church. ${boss() ? 'Create groups, choose each group’s leader, and add or remove members.' : 'Add approved members who aren’t in a group yet, or remove members from your group.'} Group leaders can send group-vs-group challenges.</p>
      <div class="card"><div class="row">${picker}</div>
      ${boss() ? `<form class="row" id="ng" style="margin-top:12px"><div class="grow"><label for="gn">New group name</label><input id="gn" type="text" maxlength="60" placeholder="Men’s Group, Young Adults, Tuesday Table…" required style="width:100%"></div><div><label>&nbsp;</label><button class="btn" type="submit">Add group</button></div></form>`
        : (mine ? '' : `<p class="sub" style="margin-top:10px">You aren’t leading a group yet. Your church admin chooses group leaders here in Groups.</p>`)}</div>
      ${G.length ? G.slice().sort((a, b) => (b.i_lead - a.i_lead)).map(card).join('') : `<div class="card"><p class="empty">No groups yet.${boss() ? ' Add your first group above.' : ''}</p></div>`}
      <div class="card"><h3 style="margin:0 0 6px;font-size:18px">Not in a group (${free.length})</h3>
        ${free.length ? `<ul class="mlist">${free.map(m => `<li><span><strong>${esc(m.name)}</strong> <span class="muted">${esc(m.email)}</span></span></li>`).join('')}</ul>` : '<p class="empty">Every approved member is in a group.</p>'}
        <p class="sub" style="margin-top:8px">Only approved members can be placed in groups. New people show up in Approvals first.</p></div>`;
  };
  BIND.groups = () => {
    $app.querySelectorAll('[data-lrok]').forEach(b => b.onclick = () => { const r = (st.leadReqs || []).find(x => x.id === b.dataset.lrok), gsel = $('lr-' + r.id).value || null; run(async () => { await Cloud.rpc('decide_group_lead', { p_id: r.id, p_approve: true, p_group: gsel }); await loadGroups(); }, `${r.name} is now a group leader. We emailed them.`); });
    $app.querySelectorAll('[data-lrno]').forEach(b => b.onclick = () => { const r = (st.leadReqs || []).find(x => x.id === b.dataset.lrno); if (!confirm(`Decline ${r.name}'s request to lead ${r.group_name}?`)) return; run(async () => { await Cloud.rpc('decide_group_lead', { p_id: r.id, p_approve: false, p_group: null }); await loadGroups(); }, 'Request declined.'); });
    if ($('gch')) $('gch').onchange = e => run(async () => { st.church = st.churches.find(x => x.church_id === e.target.value); st.gAdd = null; st.gSel = new Set(); await loadGroups(); });
    if ($('ng')) $('ng').onsubmit = e => { e.preventDefault(); const nm = $('gn').value.trim(); run(async () => { await Cloud.rpc('save_group', { cid: st.church.church_id, p_id: null, p_name: nm }); await loadGroups(); }, `${nm} added. Choose its leader and add members below.`); };
    $app.querySelectorAll('[data-rename]').forEach(b => b.onclick = () => { st.gRename = b.dataset.rename; st.msg = st.err = ''; render(); });
    $app.querySelectorAll('[data-rncx]').forEach(b => b.onclick = () => { st.gRename = null; render(); });
    $app.querySelectorAll('form[data-rn]').forEach(f => f.onsubmit = e => { e.preventDefault(); run(async () => { await Cloud.rpc('save_group', { cid: st.church.church_id, p_id: f.dataset.rn, p_name: f.querySelector('input').value }); st.gRename = null; await loadGroups(); }, 'Group renamed.'); });
    $app.querySelectorAll('[data-gdel]').forEach(b => b.onclick = () => { const g = st.groups.find(x => x.group_id === b.dataset.gdel); if (!confirm(`Delete ${g.name}? Its ${g.members} member${g.members === 1 ? '' : 's'} stay in the church and move to “Not in a group.”`)) return; run(async () => { await Cloud.rpc('delete_group', { p_id: g.group_id }); await loadGroups(); }, `${g.name} deleted.`); });
    $app.querySelectorAll('[data-lead]').forEach(sel => sel.onchange = () => run(async () => { await Cloud.rpc('set_group_lead', { p_group: sel.dataset.lead, p_partner: sel.value || null }); await loadGroups(); }, sel.value ? 'Group leader saved. They can now approve members, manage this group and send group challenges.' : 'Group leader removed.'));
    $app.querySelectorAll('[data-out]').forEach(b => b.onclick = () => { if (!confirm(`Remove ${b.dataset.nm} from ${b.dataset.g}? They stay a member of the church.`)) return; run(async () => { await Cloud.rpc('set_members_group', { p_ids: [b.dataset.out], p_group: null }); await loadGroups(); }, `${b.dataset.nm} removed from ${b.dataset.g}.`); });
    $app.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { st.gAdd = b.dataset.add; st.gSel = new Set(); st.msg = st.err = ''; render(); });
    $app.querySelectorAll('[data-addcx]').forEach(b => b.onclick = () => { st.gAdd = null; st.gSel = new Set(); render(); });
    const pool = () => { const g = st.gAdd; return canName() ? st.roster.filter(m => m.group_id !== g) : st.roster.filter(m => !m.group_id); };
    if ($('gAll')) $('gAll').onchange = e => { st.gSel = e.target.checked ? new Set(pool().map(m => m.membership_id)) : new Set(); render(); };
    $app.querySelectorAll('[data-pick]').forEach(b => b.onchange = () => { const id = b.dataset.pick; st.gSel.has(id) ? st.gSel.delete(id) : st.gSel.add(id); render(); });
    $app.querySelectorAll('[data-addgo]').forEach(b => b.onclick = () => { const ids = [...st.gSel], g = st.groups.find(x => x.group_id === b.dataset.addgo); run(async () => { const n = await Cloud.rpc('set_members_group', { p_ids: ids, p_group: g.group_id }); st.gAdd = null; st.gSel = new Set(); await loadGroups(); flash(`Added ${n} ${n === 1 ? 'member' : 'members'} to ${g.name}.`); }); });
  };

  // ---------- messages to members ----------
  VIEWS.messages = () => {
    if (!st.church) return `<h2>Messages</h2><p class="sub">Add a church first.</p>`;

      <button class="btn" type="submit" style="width:100%;margin-top:16px">Sign in</button>
      <p style="text-align:center;margin:14px 0 0"><a href="reset.html" id="fp" style="font-weight:600">Forgot your password?</a></p></form>`;
    $('fp').onclick = () => { const v = $('em').value.trim(); if (v) $('fp').href = 'reset.html?email=' + encodeURIComponent(v); };
    $('si').onsubmit = async e => { e.preventDefault(); try { await Cloud.signIn($('em').value.trim().toLowerCase(), $('pw').value); st.err = ''; await start(); } catch (x) { st.err = errMsg(x); signin(); } };
  }
  $('out').onclick = async () => { await Cloud.signOut(); location.reload(); };
  start().catch(e => { st.err = errMsg(e); signin(); });
})();
</script>
</body>
</html>
