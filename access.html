<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get the study book · The 144(P) Plan</title>
<meta name="theme-color" content="#0B2257">
<meta name="description" content="Give God your time for 12 weeks and challenge a friend, your group or another church. Part of The 144(P) Plan.">
<meta property="og:title" content="Time4God Challenge">
<meta property="og:description" content="Who will give the most time to God? Take the 12-week Time4God Challenge. #Time4GodChallenge">
<meta property="og:image" content="https://time4god.app/t4g/t4g-icon-512.png">
<link rel="manifest" href="manifest-t4g.json">
<link rel="icon" type="image/png" sizes="32x32" href="t4g/t4g-icon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="t4g/t4g-icon-48.png">
<link rel="apple-touch-icon" href="t4g/t4g-apple-touch.png">
<meta name="apple-mobile-web-app-title" content="Time4God">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<script src="./cloud.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F7F3EA;color:#14284B;font-family:'Public Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#075D61}
button,input,select,textarea{font:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #0E8A7E;outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 48px}
header{position:sticky;top:0;z-index:5;background:#0B2257;border-bottom:2px solid #D9A62B;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 12px}
header .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
header a,header button.link{color:#fff;text-decoration:none;font-weight:600;font-size:15px;background:none;border:0;padding:8px 0;cursor:pointer;min-width:60px}
header button.link{text-align:right}
header h1{flex:1;margin:0;font-size:17px;font-weight:700;text-align:center;line-height:1.2;display:flex;align-items:center;justify-content:center;gap:10px}
header h1 img{width:34px;height:34px;flex:none}
header h1 .tx{display:block;text-align:left;white-space:nowrap;font-size:15px}
header h1 small{display:block;font-size:12px;font-weight:600;color:#F2C94C;letter-spacing:.04em}
.hero{margin:0 -18px;padding:28px 22px 30px;text-align:center;color:#fff;background:linear-gradient(180deg,#0B2257 0%,#123A86 62%,#2B4FA0 80%,#C9772A 100%)}
.hero img{width:min(240px,62vw);height:auto;display:block;margin:0 auto 12px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.hero h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero .s2{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#F2C94C;margin:0 0 10px}
.hero p{color:#fff;font-size:16px;line-height:1.55;margin:0 auto;max-width:440px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.hero.small{padding:18px 22px 20px}
.hero.small img{width:min(150px,40vw);margin-bottom:8px}
.hero .tag{color:#F2C94C}
.card{background:#fff;border:1px solid #E6DFCC;border-radius:14px;box-shadow:0 1px 2px rgba(11,34,87,.05);padding:18px;margin-top:16px}
h2.t{font-family:'Source Serif 4',Georgia,serif;font-size:24px;font-weight:600;margin:22px 0 4px;color:#0B2257}
p.sub{margin:4px 0 0;color:#4F5F68;font-size:15px;line-height:1.5}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=date],textarea{width:100%;min-height:48px;border:1px solid #9AA8B0;border-radius:10px;padding:10px 12px;font-size:16px;background:#fff;color:#173344}
textarea{min-height:86px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:12px;background:#0B2257;color:#fff;font-weight:600;font-size:16px;cursor:pointer;margin-top:12px;text-decoration:none;padding:0 14px}
.btn.teal{background:linear-gradient(180deg,#F6CF5A,#D9A62B);color:#0B2257;box-shadow:0 2px 0 #A87A12}
.btn.teal:hover{filter:brightness(1.04)}
.btn.alt{background:#fff;color:#0B2257;border:1px solid #0B2257}
.btn.danger{background:#fff;color:#A33A2E;border:1px solid #A33A2E}
.btn[disabled]{background:#9AA8B0;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{margin-top:0}
.err{background:#FBEAE7;color:#7A2A20;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
.ok{background:#E8F5F3;color:#075D61;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
.pill{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:#E8F5F3;color:#075D61}
.pill.wait{background:#FFF4DC;color:#6B4E12}.pill.off{background:#EEF1F2;color:#4F5F68}.pill.live{background:#0B2257;color:#F2C94C}
.group{margin-top:24px}
.group h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#4F5F68;margin:0 0 8px}
.item{display:block;width:100%;text-align:left;background:#fff;border:1px solid #E1E7EA;border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;color:#173344}
.item:hover{border-color:#075D61}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.item .ti{font-weight:700;font-size:15px}
.item .meta{font-size:13px;color:#4F5F68;margin-top:4px}
.empty{color:#4F5F68;font-size:14px;padding:4px 2px}
.choice{display:flex;gap:12px;align-items:flex-start;border:1px solid #E1E7EA;border-radius:12px;padding:12px 14px;margin-top:8px;cursor:pointer;font-weight:500}
.choice:has(input:checked){border-color:#075D61;background:#F2FAF8}
.choice input{margin-top:4px;width:18px;height:18px;accent-color:#075D61;flex:none}
.choice strong{display:block}
.choice span{font-size:14px;color:#4F5F68}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.score .side{border-radius:12px;padding:14px 8px;background:#F3F5F6}
.score .side.lead{background:#FFF6DC;outline:2px solid #D9A62B}
.score .nm{font-weight:700;font-size:15px;line-height:1.3}
.score .big{font-family:'Source Serif 4',Georgia,serif;font-size:30px;font-weight:600;color:#0B2257;margin:6px 0 2px}
.score .sm{font-size:12px;color:#4F5F68;line-height:1.4}
.score .vs{font-weight:700;color:#4F5F68}
.msgbox{background:#F3F5F6;border-radius:10px;padding:12px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
table.days{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.days th,table.days td{padding:8px 6px;border-bottom:1px solid #E1E7EA;text-align:right}
table.days th:first-child,table.days td:first-child{text-align:left}
ol.board{list-style:none;padding:0;margin:6px 0 0}
ol.board li{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid #E1E7EA}
ol.board .rk{width:26px;font-weight:700;color:#4F5F68}
ol.board .nm{flex:1}
ol.board li.me{background:#F2FAF8;font-weight:700}
.tag{font-size:13px;font-weight:700;color:#075D61;letter-spacing:.04em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.page-q{background:#FFF6DC;border:2px solid #D9A62B;border-radius:14px;padding:18px;text-align:center;margin-top:16px}
.page-q .pg{font-family:'Source Serif 4',Georgia,serif;font-size:44px;font-weight:600;color:#0B2257;line-height:1}
.page-q .wd{font-family:'Source Serif 4',Georgia,serif;font-size:28px;font-weight:600;color:#0B2257;margin:6px 0}
.steps{margin:10px 0 0;padding-left:20px;color:#4F5F68;font-size:15px;line-height:1.6}
input.key{text-transform:uppercase;letter-spacing:.08em;font-weight:700;text-align:center;font-size:20px}
.price{font-family:'Source Serif 4',Georgia,serif;font-size:40px;font-weight:600;color:#0B2257;line-height:1}
.per{font-size:14px;color:#4F5F68}
ul.ticks{list-style:none;padding:0;margin:12px 0 0}
ul.ticks li{padding:6px 0 6px 26px;position:relative;font-size:15px;line-height:1.45}
ul.ticks li:before{content:'✓';position:absolute;left:4px;top:6px;color:#0E7A55;font-weight:700}
.status{border-radius:12px;padding:14px;margin-top:16px;font-size:15px;line-height:1.5}
.status.yes{background:#E8F5EE;color:#0E5A3E;border:1px solid #BFE3CF}
.status.no{background:#FFF8E6;color:#6B4E12;border:1px solid #F1D8A0}
.opt{margin-top:14px}
.opt h3{margin:0 0 4px;font-size:17px;color:#0B2257}
.req{border:1px solid #E6DFCC;border-radius:12px;padding:12px;margin-top:10px;font-size:15px}
</style>
</head>
<body>
<header><div class="in">
  <a href="./" id="backApp">‹ Back</a>
  <h1><img src="t4g/t4g-icon-48.png" alt="" width="34" height="34"><span class="tx">The Study Book<small>The 144(P) Plan</small></span></h1>
  <button class="link" id="signOut" hidden type="button">Sign out</button>
</div></header>
<main class="wrap" id="app" aria-live="polite"><p class="sub" style="margin-top:24px">Loading…</p></main>
<script>
(function () {
  const $app = document.getElementById('app'), $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const money = n => n == null ? '' : '$' + Number(n).toFixed(Number(n) % 1 ? 2 : 0);
  const fDate = d => new Date(d).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  const errMsg = e => (e && (e.message || e.error_description)) || 'Something went wrong. Please try again.';
  const st = { price: null, me: null, acc: null, fam: null, msg: '', err: '', busy: false, trial: null, trialCode: null, invite: null, view: null, viewing: null };
  const TRIAL_KEY = '144p-trial', AFTER_KEY = '144p-after-auth';
  // A trial invitation link: access.html?trial=CODE (kept on this device until they sign in)
  try { const q = new URLSearchParams(location.search).get('trial'); if (q) localStorage.setItem(TRIAL_KEY, q.trim().toUpperCase()); st.trialCode = localStorage.getItem(TRIAL_KEY); } catch (e) {}
  const days = n => n % 7 === 0 ? (n / 7) + (n === 7 ? ' week' : ' weeks') : n + ' days';

  // ‹ Back: one step back. Inside this page it steps back a view; otherwise it returns to where you came from in the app.
  function toApp() { try { if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) return history.back(); } catch (e) {} location.href = './'; }
  document.getElementById('backApp').onclick = e => { e.preventDefault(); toApp(); };
  // ---------- Family: up to 2 teens (13–17) on a paid membership ----------
  function familyCard() {
    const f = st.fam; if (!f) return '';
    if (f.parent) return `<div class="card" id="family"><strong>Your family</strong><p class="sub" style="margin:6px 0 0">Your account is linked to ${esc(f.parent.name)}.${f.parent.covered ? '' : ' Their membership isn’t active right now, so the study book is closed until they renew.'}</p>
      <button class="btn alt" type="button" id="leaveFam">Leave this family</button></div>`;
    if (!f.can_add && !(f.teens || []).length) return '';
    const T = f.teens || [], room = f.max - T.length;
    return `<div class="card" id="family"><strong>Family · free teen accounts</strong>
      <p class="sub" style="margin:6px 0 0">Add up to ${f.max} teens (ages 13 to 17). Each gets their own login and the full study book free while your membership lasts. You can see their time, challenges, notes and reflections.</p>
      ${T.map(t => `<div class="req" style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><strong>${esc(t.name)}</strong> ${t.status === 'active' ? '<span class="pill">Linked</span>' : '<span class="pill wait">Invited</span>'}<br>
          <span class="sub" style="font-size:13px">${t.status === 'active' ? esc(t.email || '') : `Family code <strong>${esc(t.code)}</strong>${t.email ? ' · emailed to ' + esc(t.email) : ''}`}</span></div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">${t.status === 'active' ? `<button class="btn alt" style="width:auto;min-height:40px;margin:0;font-size:14px" type="button" data-view="${t.id}">See activity</button>`
            : `<button class="btn alt" style="width:auto;min-height:40px;margin:0;font-size:14px" type="button" data-copy="${esc(t.code)}">Copy link</button><a class="btn alt" style="width:auto;min-height:40px;margin:0;font-size:14px" href="${smsHref(t)}">Text it</a>`}
          <button class="btn danger" style="width:auto;min-height:40px;margin:0;font-size:14px" type="button" data-rm="${t.id}" data-nm="${esc(t.name)}">Remove</button></div></div>
        ${st.viewing === t.id ? teenView() : ''}`).join('')}
      ${room > 0 && f.can_add ? (st.invite ? `<form id="famF" class="req" style="margin-top:10px"><strong>Add a teen</strong>
          <label for="fn">Teen’s first name</label><input id="fn" type="text" maxlength="40" required>
          <label for="fe">Teen’s own email <span style="font-weight:400;color:#4F5F68">(optional; or text them the link)</span></label><input id="fe" type="email" autocomplete="off">
          <label class="choice"><input type="checkbox" id="fok"><div><strong>I am this teen’s parent or legal guardian, and they are 13 to 17.</strong><span>Children under 13 can’t have accounts.</span></div></label>
          <div class="two"><button class="btn teal" type="submit" ${st.busy ? 'disabled' : ''}>Add teen</button><button class="btn alt" type="button" id="famX">Cancel</button></div></form>`
        : `<button class="btn teal" type="button" id="famAdd">Add a teen (${room} of ${f.max} left)</button>`) : ''}
      ${!f.can_add && T.length ? '<p class="sub" style="font-size:13px;margin-top:8px">Your membership isn’t active, so linked teens can’t read right now.</p>' : ''}</div>`;
  }
  const famUrl = code => 'https://time4god.app/family.html?code=' + code;
  const smsHref = t => 'sms:?&body=' + encodeURIComponent(`${t.name}, I added you to my Time4God Challenge membership. You get the study book free. Open this link, create your account, and accept: ${famUrl(t.code)}`);
  function teenView() {
    const v = st.view; if (!v) return '<p class="sub">Loading…</p>';
    const hm = m => (m >= 60 ? Math.floor(m / 60) + ' h ' : '') + (m % 60) + ' min';
    return `<div class="req" style="background:#FBF8F1"><div style="display:flex;gap:16px;flex-wrap:wrap"><div><span class="price" style="font-size:26px">${esc(hm(v.week_minutes))}</span><br><span class="per">this week</span></div><div><span class="price" style="font-size:26px">${esc(hm(v.season_minutes))}</span><br><span class="per">this season</span></div></div>
      <h3 style="font-size:15px;margin:14px 0 4px">Recent time and notes</h3>${(v.deposits || []).length ? `<ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.5">${v.deposits.slice(0, 20).map(d => `<li>${esc(fDate(d.activity_date + 'T12:00:00'))} · ${esc(String(d.category).replace(/_/g, ' '))} · ${d.minutes} min${d.note ? `<br><em>“${esc(d.note)}”</em>` : ''}</li>`).join('')}</ul>` : '<p class="sub" style="font-size:14px">No time recorded yet.</p>'}
      <h3 style="font-size:15px;margin:14px 0 4px">Weekly reflections</h3>${(v.reflections || []).length ? v.reflections.map(r => `<p style="font-size:14px;margin:6px 0"><strong>Week of ${esc(fDate(r.week + 'T12:00:00'))}</strong>${r.meaningful ? '<br>Most meaningful: ' + esc(r.meaningful) : ''}${r.next ? '<br>Next week: ' + esc(r.next) : ''}</p>`).join('') : '<p class="sub" style="font-size:14px">No reflections yet.</p>'}
      <h3 style="font-size:15px;margin:14px 0 4px">Challenges</h3>${(v.challenges || []).length ? `<ul style="margin:0;padding-left:18px;font-size:14px">${v.challenges.map(c => `<li>${esc(c.a || '')} vs ${esc(c.b || '…')} · ${esc(c.status)}</li>`).join('')}</ul>` : '<p class="sub" style="font-size:14px">None yet.</p>'}</div>`;
  }

  function render() {
    $('signOut').hidden = !st.me;
    const p = st.price || {}, a = st.acc;
    const fam = st.fam || {}, famCovered = !!(fam.parent && fam.parent.covered);
    const covered = a && (a.church_covers || a.seat || a.admin || famCovered);
    const guest = a && !covered && a.guest_active, keep = a && !covered && a.keep_going_price != null;
    const trial = a && !covered && !guest && a.trial_active, trialOver = a && !covered && !guest && !a.trial_active && a.trial_until;
    let status = '';
    if (st.me && a) {
      if (a.admin) status = `<div class="status yes"><strong>You have full access</strong> as the platform admin.</div>`;
      else if (famCovered && !a.seat && !a.church_covers) status = `<div class="status yes"><strong>${esc(fam.parent.name)}’s membership covers your study book.</strong> Nothing to pay. Your parent or guardian can see the time you record, your challenges, and your notes and reflections.</div>`;
      else if (a.seat) status = `<div class="status yes"><strong>You have the study book.</strong>${a.seat_expires ? ` Your access runs through ${esc(fDate(a.seat_expires))}.` : ''}</div>`;
      else if (guest) status = `<div class="status yes"><strong>${a.guest_from ? esc(a.guest_from) + ' gave you a seat.' : 'You have a guest seat.'}</strong> The full study book is yours through ${esc(fDate(a.guest_until + 'T12:00:00'))}, the last day of your challenge.</div>`;
      else if (trial) status = `<div class="status yes"><strong>Your free trial is on.</strong> The full study book is yours through ${esc(fDate(a.trial_until + 'T12:00:00'))}. Join for ${esc(money(p.individual))} any time to keep reading for a full year.</div>`;
      else if (trialOver && !keep) status = `<div class="status no"><strong>Your free trial ended on ${esc(fDate(a.trial_until + 'T12:00:00'))}.</strong> Join for ${esc(money(p.individual))} to open the study book again for a full year. Your time with God so far is saved.</div>`;
      else if (a.church_covers) status = `<div class="status yes"><strong>${esc(a.church)} covers your study book.</strong> Nothing to pay.</div>`;
      else if (a.church && a.church_status === 'pending') status = `<div class="status no"><strong>Waiting for ${esc(a.church)} to approve you.</strong> If your church has seats, you won’t need to pay. You can also get the book yourself below.</div>`;
      else if (a.church && !a.church_license) status = `<div class="status no"><strong>${esc(a.church)} hasn’t added study book seats yet.</strong> Ask your church leader, or get the book yourself below.</div>`;
      else if (keep) status = `<div class="status no"><strong>Your guest seat has ended.</strong> Keep going with your own year at the guest price below.</div>`;
      else status = `<div class="status no"><strong>You don’t have the study book yet.</strong> Choose one of the options below.</div>`;
    }
    let html = `<div class="hero small"><picture><source srcset="t4g/t4g-logo.webp" type="image/webp"><img src="t4g/t4g-logo.png" alt="Time4God Challenge" width="150" height="150"></picture><h2>Time4God Challenge</h2><div class="s2">The 144(P) Plan</div><p>Signing up is free. The 12-week study book is how you go deeper.</p></div>
      ${(st.err ? `<div class="err" role="alert">${esc(st.err)}</div>` : '') + (st.msg ? `<div class="ok">${esc(st.msg)}</div>` : '')}
      ${status}
      ${!st.me && st.trial && st.trial.ok ? `<div class="card" style="border:2px solid #D9A62B;background:#FFF8E6"><strong style="font-size:18px">You’re invited: ${esc(days(st.trial.days))} free</strong>
        <p class="sub" style="margin:6px 0 0">${st.trial.name ? esc(st.trial.name) + ', you' : 'You'}’re invited to read the full study book free for ${esc(days(st.trial.days))}. Create your free account (or sign in) and your free days start right away. After that, join for ${esc(money(p.individual))} to keep reading.</p>
        <button class="btn teal" type="button" data-auth="register">Create my free account</button><button class="btn alt" type="button" data-auth="signin">I already have an account</button></div>` : ''}
      ${!st.me && st.trial && !st.trial.ok ? `<div class="err">${esc(st.trial.reason || 'This invitation isn’t available.')}</div>` : ''}
      <div class="card"><strong>Free with your account</strong>
        <ul class="ticks"><li>Log the time you give to God each day</li><li>Daily reminders and your streak</li><li>Take part in the Time4God Challenge</li></ul></div>
      <div class="card"><strong>The study book in the app</strong>
        <div style="display:flex;align-items:baseline;gap:8px;margin-top:10px"><span class="price">${esc(money(p.individual))}</span><span class="per">one payment · one year · tax included</span></div>
        <ul class="ticks"><li><em>What Will You Give Today?</em>, one chapter each week for 12 weeks</li><li>Weekly journal pages and checkpoints</li><li>Listen to any chapter read aloud</li><li><strong>Up to ${esc(String((st.fam && st.fam.guest_max) || 4))} guest seats a year.</strong> When someone accepts your Time4God Challenge, they get the study book free for that challenge</li><li><strong>Free teen accounts.</strong> Parents can add up to 2 teens (ages 13 to 17) with their own login, at no extra cost</li></ul></div>`;
    if (!st.me) {
      html += `<button class="btn teal" type="button" data-auth="register">Create your free account</button><button class="btn alt" type="button" data-auth="signin">Sign in</button>
        <p class="sub" style="margin-top:12px">After you sign in, come back here to get the study book.</p>`;
    } else if (keep) {
      html += `<div class="card opt"><h3>Keep going · ${esc(money(a.keep_going_price))}</h3><p class="sub" style="margin:0 0 4px">Your own full year of the study book for ${esc(money(a.keep_going_price))} instead of ${esc(money(p.individual))}, because you came as a guest. It includes a seat to give the next person you challenge. All sales are final.</p>
          <button class="btn teal" id="keep" type="button" ${st.busy ? 'disabled' : ''}>${st.busy ? 'Opening secure checkout…' : 'Keep going · ' + esc(money(a.keep_going_price))}</button></div>
        ${guest ? '<a class="btn alt" href="read.html">Open the study book</a>' : ''}`;
    } else if (!covered) {
      if (trial) html += `<a class="btn alt" href="read.html">Open the study book</a>`;
      html += `<div class="card opt"><h3>${trial || trialOver ? 'Join' : 'Buy it for yourself'} · ${esc(money(p.individual))}</h3><p class="sub" style="margin:0 0 4px">Pay securely with card, Apple Pay or Google Pay. All sales are final. By buying you agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</p>
          <button class="btn teal" id="buy" type="button" ${st.busy ? 'disabled' : ''}>${st.busy ? 'Opening secure checkout…' : 'Get the study book · ' + esc(money(p.individual))}</button></div>
        <div class="card opt"><h3>Have the printed book?</h3><p class="sub" style="margin:0">Your copy includes the app edition and a seat to give. Use the book key printed inside.</p><a class="btn alt" href="redeem.html">Enter my book key</a></div>
        ${st.fam && st.fam.parent ? familyCard() : ''}
        <div class="card opt"><h3>Is your church taking part?</h3><p class="sub" style="margin:0">If your church bought seats, the study book is included once you’re approved. Enter your church code in My Account.</p><a class="btn alt" href="./">Join my church</a></div>`;
    } else {
      html += `<a class="btn teal" href="read.html">Open the study book</a>`;
      const gmax = fam.guest_max || 4;
      if (a && a.guest_seats_left > 0) html += `<div class="card"><strong>${a.guest_seats_left} of ${gmax} guest seats left this year</strong><p class="sub" style="margin:6px 0 0">Challenge a friend to the Time4God Challenge. When they accept, they get the study book free for that challenge. You can give up to ${gmax} guest seats in any 12 months.</p><a class="btn alt" href="challenges.html">Challenge someone</a></div>`;
      else if (a && a.seat) html += `<p class="sub" style="margin-top:12px">You’ve given all ${gmax} guest seats for the last 12 months${a.guest_seat_given_to ? ` (most recently to ${esc(a.guest_seat_given_to)})` : ''}. A seat frees up 12 months after each one was used.</p>`;
      html += familyCard();
    }
    html += `<div class="card"><strong>Do you lead a church or a group?</strong><p class="sub" style="margin:6px 0 0">Register your church or group, get a join code for your members, and buy study book seats for everyone${p.church_top_rate != null ? ` (${esc(money(p.church_top_rate))} a seat, less for larger churches)` : ''}.</p>
      <div class="two" style="margin-top:12px"><a class="btn alt" href="church-signup.html" style="margin-top:0">Church leaders</a><a class="btn alt" href="leaders.html?as=group" style="margin-top:0">Group leaders</a></div></div>`;
    if (st.support) html += `<p class="sub" style="margin-top:14px;text-align:center">Questions? Email <a href="mailto:${esc(st.support)}">${esc(st.support)}</a></p>`;
    $app.innerHTML = html;
    // Sign-in buttons come back here afterwards (and keep the trial invitation)
    $app.querySelectorAll('[data-auth]').forEach(b => b.onclick = () => { try { localStorage.setItem(AFTER_KEY, 'access.html'); } catch (e) {} location.href = './?start=' + b.dataset.auth; });
    if ($('famAdd')) $('famAdd').onclick = () => { st.invite = true; render(); $('fn').focus(); };
    if ($('famX')) $('famX').onclick = () => { st.invite = null; render(); };
    if ($('famF')) $('famF').onsubmit = async e => { e.preventDefault(); const a = { p_name: $('fn').value, p_email: $('fe').value, p_parent_ok: $('fok').checked };
      if (!a.p_parent_ok) { st.err = 'Please confirm you are this teen’s parent or legal guardian and that they are 13 to 17.'; render(); $('fn').value = a.p_name; $('fe').value = a.p_email; $('family').scrollIntoView(); return; }
      st.err = st.msg = ''; st.busy = true; render();
      try { await Cloud.rpc('family_invite', a); st.invite = null; st.fam = await Cloud.rpc('my_family');
        st.msg = a.p_email.trim() ? `We emailed ${a.p_name} an invitation. You can also text them the link.` : `${a.p_name} is added. Text them the link, or copy it and send it another way.`; }
      catch (x) { st.err = errMsg(x); }
      st.busy = false; render(); if (st.err && $('fn')) { $('fn').value = a.p_name; $('fe').value = a.p_email; $('fok').checked = a.p_parent_ok; } };
    $app.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(famUrl(b.dataset.copy)); b.textContent = 'Copied'; } catch (x) { prompt('Copy this link:', famUrl(b.dataset.copy)); } });
    $app.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => { if (!confirm(`Remove ${b.dataset.nm} from your family? They’ll lose the study book that comes from your membership.`)) return;
      try { await Cloud.rpc('family_remove', { p_id: b.dataset.rm }); st.fam = await Cloud.rpc('my_family'); st.viewing = null; st.msg = `${b.dataset.nm} was removed.`; } catch (x) { st.err = errMsg(x); } render(); });
    $app.querySelectorAll('[data-view]').forEach(b => b.onclick = async () => { if (st.viewing === b.dataset.view) { st.viewing = null; return render(); }
      st.viewing = b.dataset.view; st.view = null; render(); try { st.view = await Cloud.rpc('family_teen_view', { p_link: b.dataset.view }); } catch (x) { st.err = errMsg(x); st.viewing = null; } render(); });
    if ($('leaveFam')) $('leaveFam').onclick = async () => { if (!confirm('Leave this family? Your study book from your parent’s membership will close.')) return;
      try { await Cloud.rpc('family_remove', { p_id: st.fam.parent.id }); st.fam = await Cloud.rpc('my_family'); st.acc = await Cloud.rpc('my_access'); } catch (x) { st.err = errMsg(x); } render(); };
    if ($('keep')) $('keep').onclick = async () => { st.err = ''; st.busy = true; render(); try { await Cloud.checkout('keep_going'); } catch (e) { st.busy = false; st.err = errMsg(e); render(); } };
    if ($('buy')) $('buy').onclick = async () => { st.err = ''; st.busy = true; render(); try { await Cloud.checkout('individual'); } catch (e) { st.busy = false; st.err = errMsg(e); render(); } };
  }

  async function load() {
    try { st.price = await Cloud.rpc('public_pricing'); } catch (e) {}
    try { st.support = (await Cloud.rpc('public_contact')).support_email; } catch (e) {}
    if (st.trialCode) { try { st.trial = await Cloud.rpc('trial_preview', { p_code: st.trialCode }); } catch (e) {} }
    const s = await Cloud.session();
    if (s) {
      st.me = await Cloud.ensurePartner();
      try { const r = await Cloud.settlePayments(); if (r === 'paid') st.msg = 'Payment received. Thank you! Your study book is ready.'; if (r === 'canceled') st.msg = 'Checkout canceled. You weren’t charged.'; }
      catch (e) { st.err = 'We couldn’t confirm your payment yet: ' + errMsg(e) + ' If you were charged, reload this page in a minute.'; }
      // Accept a trial invitation once signed in
      if (st.trialCode) {
        try { const r = await Cloud.rpc('trial_claim', { p_code: st.trialCode });
          if (r && r.status === 'ok') st.msg = `Welcome! Your free trial has started. Read the full study book through ${fDate(r.trial_until + 'T12:00:00')}.`; }
        catch (e) { st.err = errMsg(e); }
        try { localStorage.removeItem(TRIAL_KEY); history.replaceState(null, '', location.pathname); } catch (e) {}
        st.trialCode = null; st.trial = null;
      }
      try { st.acc = await Cloud.rpc('my_access'); } catch (e) {}
      try { st.fam = await Cloud.rpc('my_family'); } catch (e) {}
    }
    render();
    if (location.hash === '#family' && $('family')) $('family').scrollIntoView();
  }
  $('signOut').onclick = async () => { await Cloud.signOut(); st.me = null; st.acc = null; render(); };
  load().catch(e => { st.err = errMsg(e); render(); });
})();
</script>
</body>
</html>
